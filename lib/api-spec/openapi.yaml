        classification in the latest WIP file.
      properties:
        id:
          type: integer
        projectCode:
          type: string
        bucket:
          type: string
          enum: [b, c, d]
        side:
          type: string
          enum: [in_house, out_vendor]
        createdAt:
          type: string
      required:
