      required:
        - activity
        - markCount
        - stalledCount
        - slowCount
        - avgDaysPerStage
    VelocityResponse:
      type: object
      description: Per-identity velocity info with project / contractor / stage aggregates.
      properties:
        importId:
          type: integer
        hasHistory:
          type: boolean
          description: True when at least one earlier import exists to compare against.
        windowReports:
          type: integer
          description: Number of imports walked to build the snapshot series.
        items:
          type: array
          items:
            $ref: "#/components/schemas/VelocityItem"
        projects:
          type: array
          items:
            $ref: "#/components/schemas/VelocityProjectAgg"
        contractors:
          type: array
          items:
            $ref: "#/components/schemas/VelocityContractorAgg"
        stages:
          type: array
          items:
            $ref: "#/components/schemas/VelocityStageAgg"
      required:
        - importId
        - hasHistory
        - windowReports
        - items
        - projects
        - contractors
        - stages
    ProjectMilestone:
      type: object
      description: Permanent turnaround milestones for one project.
      properties:
        project:
          type: string
        projectStart:
          type: ["string", "null"]
          description: Earliest Assign Date across all marks ever seen (turnaround clock start).
        readyDate:
          type: ["string", "null"]
          description: Date Milestone 1 (all marks at Y or gone) first became true.
        readyTurnaroundDays:
          type: ["integer", "null"]
        dispatchedDate:
          type: ["string", "null"]
          description: Date Milestone 2 (project entirely absent) first became true.
        dispatchedTurnaroundDays:
          type: ["integer", "null"]
        dispatchLagDays:
          type: ["integer", "null"]
          description: dispatchedTurnaroundDays minus readyTurnaroundDays.
        marksTotal:
          type: integer
          description: Distinct mark identities ever seen for the project.
        plannedReadyDays:
          type: ["integer", "null"]
          description: Cumulative target at Y for the project (resolved ideal-days).
        varianceReadyDays:
          type: ["integer", "null"]
          description: readyTurnaroundDays minus plannedReadyDays (+ = slower than planned).
        limitedHistory:
          type: boolean
          description: Captured with no prior in-progress observation.
        reopened:
          type: boolean
          description: A mark returned to an earlier activity after a milestone was captured.
      required:
        - project
        - projectStart
        - readyDate
        - readyTurnaroundDays
        - dispatchedDate
        - dispatchedTurnaroundDays
        - dispatchLagDays
        - marksTotal
        - plannedReadyDays
        - varianceReadyDays
        - limitedHistory
        - reopened
    MilestonesResponse:
      type: object
      description: Permanent per-project turnaround milestones.
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ProjectMilestone"
        generatedAt:
          type: string
      required:
        - items
        - generatedAt
    ReviewRequest:
      type: object
      properties:
        importId:
          type: integer
          description: The import to review.
        compareTo:
          type: ["integer", "null"]
          description: Optional base import id to compare against instead of the previous import.
        deep:
          type: ["boolean", "null"]
          description: Request a deeper model pass that adds a prioritized remediation plan.
      required:
        - importId
    ReviewFinding:
      type: object
      properties:
        severity:
          type: string
          enum: [info, warn, error]
        check:
          type: string
          description: Name of the consistency check.
        markId:
          type: ["string", "null"]
        message:
          type: string
        expected:
          type: ["string", "null"]
        actual:
          type: ["string", "null"]
      required:
        - severity
        - check
        - markId
        - message
        - expected
        - actual
    ReviewResult:
      type: object
      properties:
        available:
          type: boolean
          description: False when ANTHROPIC_API_KEY is unset.
        verdict:
          type: ["string", "null"]
          enum: [pass, warn, fail, null]
        summary:
          type: ["string", "null"]
        stats:
          type: ["object", "null"]
          additionalProperties: true
          description: Free-form key/value stats produced by the review.
        findings:
          type: array
          items:
            $ref: "#/components/schemas/ReviewFinding"
        plan:
          type: ["array", "null"]
          items:
            type: string
          description: Prioritized remediation steps, present only after a deep review.
        deep:
          type: boolean
          description: True when the result came from the deeper model pass.
      required:
        - available
        - verdict
        - summary
        - stats
        - findings
        - plan
        - deep
    ReportFilters:
      type: object
      description: Optional slice to analyze. When all fields are empty the whole import is analyzed.
      properties:
        job:
          type: ["string", "null"]
        structure:
          type: ["string", "null"]
        mark:
          type: ["string", "null"]
          description: Matches a record's markId or markTail.
        contractor:
          type: ["string", "null"]
        activity:
          type: ["string", "null"]
        search:
          type: ["string", "null"]
          description: Case-insensitive substring over markId, markTail, section, contractor.
        dateStart:
          type: ["string", "null"]
          description: Inclusive assign-date lower bound (YYYY-MM-DD).
        dateEnd:
          type: ["string", "null"]
          description: Exclusive assign-date upper bound (YYYY-MM-DD).
    ReportRequest:
      type: object
      properties:
        importId:
          type: integer
          description: The import to analyze.
        compareTo:
          type: ["integer", "null"]
          description: Optional base import id for throughput deltas instead of the previous import.
        regenerate:
          type: ["boolean", "null"]
          description: Ignore any cached report and generate a fresh one.
        filters:
          $ref: "#/components/schemas/ReportFilters"
      required:
        - importId
    ReportRisk:
      type: object
      properties:
        title:
          type: string
        severity:
          type: string
          enum: [high, med, low]
        metric:
          type: string
          description: The figure from the analytics pack that backs this risk.
        why:
          type: string
      required:
        - title
        - severity
        - metric
        - why
    ReportSummary:
      type: object
      properties:
        headline:
          type: string
          description: 1-2 sentence state of turnaround.
        health:
          type: string
          enum: [good, watch, critical]
        topRisks:
          type: array
          items:
            $ref: "#/components/schemas/ReportRisk"
      required:
        - headline
        - health
        - topRisks
    ReportAction:
      type: object
      properties:
        priority:
          type: integer
        action:
          type: string
        target:
          type: string
          description: stage / contractor / job the action applies to.
        rationale:
          type: string
        expectedImpact:
          type: string
        effort:
          type: string
          enum: [low, med, high]
        horizon:
          type: string
          enum: [now, week, month]
      required:
        - priority
        - action
        - target
        - rationale
        - expectedImpact
        - effort
        - horizon
    ReportBottleneck:
      type: object
      properties:
        area:
          type: string
          enum: [activity, contractor, job, structure]
        name:
          type: string
        metric:
          type: string
        finding:
          type: string
      required:
        - area
        - name
        - metric
        - finding
    ReportDetailed:
      type: object
      properties:
        bottlenecks:
          type: array
          items:
            $ref: "#/components/schemas/ReportBottleneck"
        ageingAnalysis:
          type: string
        contractorAnalysis:
          type: string
        throughput:
          type: string
        dataQuality:
          type: array
          items:
            type: string
        assumptions:
          type: array
          items:
            type: string
      required:
        - bottlenecks
        - ageingAnalysis
        - contractorAnalysis
        - throughput
        - dataQuality
        - assumptions
    ReportResult:
      type: object
      properties:
        available:
          type: boolean
          description: False when ANTHROPIC_API_KEY is unset.
        generatedAt:
          type: ["string", "null"]
        importId:
          type: ["integer", "null"]
        model:
          type: ["string", "null"]
        filtered:
          type: boolean
          description: True when the analysis was restricted to a filtered slice.
        cached:
          type: boolean
          description: True when the result was served from the advisory cache.
        summary:
          oneOf:
            - $ref: "#/components/schemas/ReportSummary"
            - type: "null"
        actionPlan:
          type: array
          items:
            $ref: "#/components/schemas/ReportAction"
        detailed:
          oneOf:
            - $ref: "#/components/schemas/ReportDetailed"
            - type: "null"
      required:
        - available
        - generatedAt
        - importId
        - model
        - filtered
        - cached
        - summary
        - actionPlan
        - detailed
