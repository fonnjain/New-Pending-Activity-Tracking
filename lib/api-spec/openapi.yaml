          type: string
          description: Mark identity (mark_id) the manual thickness is pinned to.
        thicknessMm:
          type: number
          description: Manually entered thickness in mm.
        updatedAt:
          type: string
      required:
        - markId
        - thicknessMm
    ManualThicknessInput:
      type: object
      properties:
        markId:
