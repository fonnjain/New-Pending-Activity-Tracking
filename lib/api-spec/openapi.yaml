          type: string
          description: Normalized contractor name (join key).
        displayName:
          type: string
          description: Contractor name as last seen/entered (for display).
        category:
          type: string
          enum: [IN_HOUSE, SUB_CONTRACTOR, OUT_VENDOR, UNCLASSIFIED]
          description: Contractor sub-category.
        outVendorType:
          type: array
