      properties:
        markId:
          type: string
        jobCardNo:
          type: ["string", "null"]
        job:
          type: string
          description: Project key (record's job field).
        contractor:
          type: string
        activity:
          type: string
          description: Current activity code at this import.
        ageingDays:
          type: ["integer", "null"]
        status:
          type: string
          enum: [moving, slow, stalled, insufficient]
        trend:
          type: string
          enum: [accelerating, steady, decelerating, stalled, unknown]
        daysPerStage:
          type: ["number", "null"]
          description: Observed days per advanced stage; null when no measurable advance.
        expectedDaysPerStage:
          type: ["number", "null"]
        stagesRemaining:
          type: ["integer", "null"]
        etaDays:
          type: ["number", "null"]
          description: Projected days from today to completion at the observed pace.
        etaGap:
