        verdict:
          type: ["string", "null"]
          enum: [ok, reject, null]
        reason:
          type: ["string", "null"]
          description: Why the file was rejected, when verdict is reject.
        expectedShape:
          type: ["string", "null"]
          description: A short description of the expected report shape, on reject.
        sanitize:
          type: array
          items:
            $ref: "#/components/schemas/StagedSanitizeSuggestion"
          description: Optional descriptive cleanups, present only when verdict is ok.
        fileType:
          type: string
          enum: [wip, order-review, unknown]
          description: Detected file type; present for Order Review and unknown files.
        aiAdvisory:
          type: ["string", "null"]
          description: >
            AI-generated advisory narrative for Order Review files (Part 3 of the sanity
            check). Null when AI is unavailable, when the file is not Order Review, or
            when the AI call failed. Advisory only — never blocks the import.
      required:
        - available
        - verdict
        - reason
        - expectedShape
        - sanitize
    AcceptedSuggestion:
      type: object
