        - rows
    InventoryManualEntry:
      type: object
      description: >
        One persisted manual entry for Inventory Bucket A ("Project to Start")
        or Bucket E ("Material Ready But Not Dispatched"). Never derived; never
        cleared by a WIP or Order Review re-upload.
      properties:
        id:
          type: integer
        projectCode:
          type: string
        side:
          type: string
          enum: [in_house, out_vendor]
        note:
          type: string
          nullable: true
        createdAt:
          type: string
      required:
