    GraceCell:
      type: object
      description: >
        One grace band cell. MANUAL pins a typed `value` (days); AUTO derives the
        grace from `percent` of THIS activity's own ideal days
        (effective = round(percent/100 * idealDays)). `mode` decides which is
        effective; both fields may be present so toggling auto<->manual remembers
        the last percentage/value.
      properties:
        mode:
          type: string
          enum: [auto, manual]
          description: auto = derive from percent of ideal days; manual = pinned value.
        percent:
          type: number
          description: AUTO only — percent of this activity's ideal days.
        value:
          type: number
          description: MANUAL only — pinned grace days (overrun beyond the cumulative target).
      required:
        - mode
    PreWarnConfig:
      type: object
      description: >
        Three escalating PRE-WARNING thresholds, each a PERCENT of the activity's
        cumulative target consumed (consumed = ageing / cumulativeTarget). They
        apply only while a mark is still WITHIN target; once exceeded the grace
        bands take over. After resolution 0 <= pw1 <= pw2 <= pw3 <= 100.
      properties:
        pw1:
          type: number
          description: First pre-warning threshold (percent of target consumed).
        pw2:
          type: number
          description: Second pre-warning threshold (percent of target consumed).
        pw3:
          type: number
          description: Third pre-warning threshold (percent of target consumed).
      required:
        - pw1
        - pw2
        - pw3
    PartialPreWarnConfig:
      type: object
      description: >
        Sparse per-project pre-warning override; any subset of pw1/pw2/pw3. A
        present field replaces the global; an absent field inherits the global.
      properties:
        pw1:
          type: number
        pw2:
          type: number
        pw3:
          type: number
    ActivityConfig:
      type: object
      description: >
        Per-activity turnaround configuration. idealDays feeds the cumulative
        target; yellow/orange/red are grace-band CELLS (auto/manual). Resolved
        effective grace is validated non-negative with yellow <= orange <= red.
        preWarn holds the within-target pre-warning percentage thresholds.
      properties:
        idealDays:
          type: number
          description: Ideal days for this single activity (feeds the cumulative target).
        yellow:
          $ref: "#/components/schemas/GraceCell"
        orange:
          $ref: "#/components/schemas/GraceCell"
        red:
          $ref: "#/components/schemas/GraceCell"
        preWarn:
          $ref: "#/components/schemas/PreWarnConfig"
      required:
        - idealDays
        - yellow
        - orange
        - red
        - preWarn
    PartialActivityConfig:
      type: object
      description: >
        Sparse per-project override of any subset of {idealDays, yellow/orange/red
        cell, preWarn}. Any field present REPLACES the global value for that
        (project, activity); any field absent INHERITS the global value (per cell).
        All fields optional.
      properties:
        idealDays:
          type: number
          description: Override ideal days for this activity (feeds the cumulative target).
        yellow:
          $ref: "#/components/schemas/GraceCell"
        orange:
          $ref: "#/components/schemas/GraceCell"
        red:
          $ref: "#/components/schemas/GraceCell"
        preWarn:
          $ref: "#/components/schemas/PartialPreWarnConfig"
    CategorySettings:
      type: object
      description: >
        One NTLT category's turnaround config: a global ("All Sections")
        per-activity map keyed by THIS category's sequence activity codes, plus
        optional sparse per-SECTION overrides (the NTLT analogue of activities +
        perProject). TLT stays at the top level of TurnaroundSettings.
      properties:
        activities:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/ActivityConfig"
          description: Global ("All Sections") per-activity config for this NTLT category.
        perSection:
          type: object
          additionalProperties:
            type: object
            additionalProperties:
              $ref: "#/components/schemas/PartialActivityConfig"
          description: >
            Sparse per-section overrides keyed by section (group_key) then
            activity code. Only overridden cells/fields are stored.
      required:
        - activities
