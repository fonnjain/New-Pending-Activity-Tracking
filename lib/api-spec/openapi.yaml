          type: array
          items:
            $ref: "#/components/schemas/UnknownProjectCauses"
          description: >
            Cause classification for each project that has Unknown structures,
            including those that may be suppressed by the < 1 MT threshold.
      required:
        - available
        - rows
        - totals
        - unknownCauses
    ReportResult:
      type: object
      properties:
        available:
          type: boolean
          description: False when ANTHROPIC_API_KEY is unset.
        generatedAt:
          type: ["string", "null"]
        importId:
          type: ["integer", "null"]
        model:
          type: ["string", "null"]
        filtered:
          type: boolean
          description: True when the analysis was restricted to a filtered slice.
        cached:
          type: boolean
          description: True when the result was served from the advisory cache.
        summary:
          oneOf:
            - $ref: "#/components/schemas/ReportSummary"
            - type: "null"
        actionPlan:
          type: array
          items:
            $ref: "#/components/schemas/ReportAction"
        detailed:
          oneOf:
            - $ref: "#/components/schemas/ReportDetailed"
            - type: "null"
      required:
        - available
        - generatedAt
        - importId
        - model
        - filtered
        - cached
        - summary
        - actionPlan
        - detailed
