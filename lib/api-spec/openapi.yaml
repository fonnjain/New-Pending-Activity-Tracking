    InventoryManualEntry:
      type: object
      description: >
        One persisted manual entry for Inventory Bucket A ("Project to Start")
        or Bucket E ("Material Ready But Not Dispatched"). Never derived; never
        cleared by a WIP or Order Review re-upload.
      properties:
        id:
          type: integer
        projectCode:
          type: string
        mfcBatch:
          type: string
          nullable: true
          description: Bucket E only -- MFC Batch letter (A/B/C/D) or "Z" (not yet batched). Governs which structures are removed from Buckets C and D. Always null for Bucket A entries.
        woOrderQtyMt:
          type: number
          nullable: true
          description: Bucket A only -- manually typed Work Order Qty weight (MT) for a brand-new project not yet in WIP or Order Review. Always null for Bucket E entries.
        side:
          type: string
          enum: [in_house, out_vendor]
        note:
          type: string
          nullable: true
        createdAt:
          type: string
      required:
        - id
        - projectCode
        - mfcBatch
        - woOrderQtyMt
        - side
        - note
        - createdAt
    InventoryManualEntryInput:
      type: object
      properties:
        id:
          type: integer
          description: Omit to insert a new entry; supply to update an existing one.
        projectCode:
          type: string
        mfcBatch:
          type: string
          nullable: true
          description: Bucket E only -- MFC Batch letter (A/B/C/D) or "Z". Omit or null for Bucket A entries.
        woOrderQtyMt:
          type: number
          nullable: true
          description: Bucket A only -- manually typed Work Order Qty weight (MT). Ignored for Bucket E entries.
        side:
          type: string
          enum: [in_house, out_vendor]
        note:
          type: string
          nullable: true
      required:
        - projectCode
        - side
