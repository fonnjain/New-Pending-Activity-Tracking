openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Login/logout, session status, and password management
  - name: users
    description: User management (admin only)
  - name: imports
    description: Import, merge, and change-log operations
  - name: ai
    description: Optional, advisory-only AI assists (sanitize suggestions and consistency review)
  - name: settings
    description: App-level turnaround-warning configuration (ideal days, grace bands)
  - name: admin
    description: Manual maintenance triggers for otherwise-automatic recompute/backfill passes
paths:
  /settings:
    get:
      operationId: getSettings
      tags: [settings]
      summary: Get turnaround settings
      description: >
        Returns the singleton turnaround-warning configuration: a per-activity
        map where each PROCESS_SEQUENCE activity has its own ideal days plus
        yellow/orange/red grace bands. When nothing has been saved yet, returns
        the built-in defaults. Public (read-only).
      responses:
        "200":
          description: Current turnaround settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TurnaroundSettings"
    put:
      operationId: updateSettings
      tags: [settings]
      summary: Update turnaround settings
      description: >
        Upserts the singleton turnaround-warning configuration. Requires
        authentication. Bands are validated and normalized server-side
        (non-negative; yellow <= orange <= red) and the normalized object is
        echoed back.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TurnaroundSettings"
      responses:
        "200":
          description: Saved turnaround settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TurnaroundSettings"
        "400":
          description: Invalid settings payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /rsj-thickness:
    get:
      operationId: listRsjThickness
      tags: [thickness]
      summary: List RSJ thickness lookup entries
      description: >
        Returns the RSJ Types & Thickness lookup table (cleaned "RSJ <dims>"
        group key -> thickness in mm). Used to auto-resolve thickness for NTLT/RSJ
        marks. Public (read-only).
      responses:
        "200":
          description: RSJ thickness entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RsjThickness"
    put:
      operationId: upsertRsjThickness
      tags: [thickness]
      summary: Create or update an RSJ thickness entry
      description: >
        Upserts one RSJ lookup entry keyed by the cleaned "RSJ <dims>" group key.
        Requires authentication. RSJ marks with this group key resolve to the new
        thickness on the next read (live recompute).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RsjThicknessInput"
      responses:
        "200":
          description: Saved entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RsjThickness"
        "400":
          description: Invalid payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteRsjThickness
      tags: [thickness]
      summary: Delete an RSJ thickness entry
      description: >
        Removes one RSJ lookup entry. Requires authentication. The group key is
        passed as a query param (it can contain spaces) to avoid path-segment
        encoding issues.
      parameters:
        - name: groupKey
          in: query
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
  /manual-thickness:
    get:
      operationId: listManualThickness
      tags: [thickness]
      summary: List manual thickness pins
      description: >
        Returns manual thickness values keyed by mark_id (used for NTLT/GENERAL
        and any hand-pinned mark). These survive re-imports. Public (read-only).
      responses:
        "200":
          description: Manual thickness entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ManualThickness"
    put:
      operationId: upsertManualThickness
      tags: [thickness]
      summary: Create or update a manual thickness pin
      description: >
        Upserts one manual thickness value keyed by mark_id. Requires
        authentication. The mark resolves to this value (source "manual") on the
        next read and the value persists across re-imports.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManualThicknessInput"
      responses:
        "200":
          description: Saved entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManualThickness"
        "400":
          description: Invalid payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteManualThickness
      tags: [thickness]
      summary: Delete a manual thickness pin
      description: >
        Removes one manual thickness pin (the mark reverts to auto/unset).
        Requires authentication. The mark id is passed as a query param (it can
        contain backslashes and spaces) to avoid path-segment encoding issues.
      parameters:
        - name: markId
          in: query
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
  /fabrication-priorities:
    get:
      operationId: listFabricationPriorities
      tags: [fabricationPriorities]
      summary: List Fabrication-Load priorities
      description: >
        Returns the per-row priorities (P1..P10) for the "Fabrication Load for
        TLT" report, keyed by (section, column, project). Display/planning
        overlay only; never changes parsing, ageing, dedup, qty, the row hash,
        classification, or alert math. Public (read-only).
      responses:
        "200":
          description: Fabrication-Load priority entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FabricationPriority"
    put:
      operationId: upsertFabricationPriority
      tags: [fabricationPriorities]
      summary: Set one Fabrication-Load priority
      description: >
        Upserts one priority keyed by (section, column, project). The report
        reflects it on the next read. Purely a planning overlay.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FabricationPriorityInput"
      responses:
        "200":
          description: Saved entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FabricationPriority"
        "400":
          description: Invalid payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteFabricationPriority
      tags: [fabricationPriorities]
      summary: Clear one Fabrication-Load priority
      description: >
        Removes one priority (the row reverts to unset). The key parts are passed
        as query params because the project string can contain spaces and
        punctuation.
      parameters:
        - name: section
          in: query
          required: true
          schema:
            type: string
        - name: column
          in: query
          required: true
          schema:
            type: string
        - name: project
          in: query
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
  /contractor-categories:
    get:
      operationId: listContractorCategories
      tags: [contractorCategories]
      summary: List contractor sub-category mappings
      description: >
        Returns the contractor sub-category overlay (normalized name key ->
        category + FAB/GALVA tags). Joined to records at read time; never changes
        parsing, ageing, dedup, qty, or the contractor string. Public (read-only).
      responses:
        "200":
          description: Contractor sub-category entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ContractorCategory"
    put:
      operationId: upsertContractorCategory
      tags: [contractorCategories]
      summary: Create or update a contractor sub-category mapping
      description: >
        Upserts one contractor mapping keyed by the normalized contractor name.
        Requires authentication. Records for this contractor resolve to the new
        category/tags on the next read (live join).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContractorCategoryInput"
      responses:
        "200":
          description: Saved entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContractorCategory"
        "400":
          description: Invalid payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteContractorCategory
      tags: [contractorCategories]
      summary: Delete a contractor sub-category mapping
      description: >
        Removes one contractor mapping (the contractor reverts to Unclassified).
        Requires authentication. The name key is passed as a query param (it can
        contain spaces and punctuation) to avoid path-segment encoding issues.
      parameters:
        - name: nameKey
          in: query
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/me:
    get:
      operationId: getAuthStatus
      tags: [auth]
      summary: Current authentication status
      description: >
        Returns whether the current request carries a valid signed session cookie.
        Used by the frontend to gate the Data view behind login.
      responses:
        "200":
          description: Authentication status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthStatus"
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Log in
      description: >
        Validates the submitted email and password against the users table.
        On success, sets a signed, httpOnly session cookie and returns user info.
        Returns 401 on invalid credentials.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthCredentials"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthStatus"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Login not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Log out
      description: Clears the session cookie.
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthStatus"
  /auth/change-password:
    post:
      operationId: changePassword
      tags: [auth]
      summary: Change own password
      description: >
        Authenticated users can change their own password. Must provide the
        current password for verification. Clears the mustChangePassword flag.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "200":
          description: Password changed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                required:
                  - success
        "400":
          description: New password too short
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated or wrong current password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List all users
      description: Admin only. Returns all registered users.
      responses:
        "200":
          description: User list
          content:
            application/json:
              schema:
                type: object
                properties:
                  users:
                    type: array
                    items:
                      $ref: "#/components/schemas/AppUser"
                required:
                  - users
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not an admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createUser
      tags: [users]
      summary: Create a user
      description: Admin only. Creates a new user with the default password.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: "#/components/schemas/AppUser"
                required:
                  - user
        "400":
          description: Missing email
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not an admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Email already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /users/{id}/reset-password:
    put:
      operationId: resetUserPassword
      tags: [users]
      summary: Reset a user's password
      description: Admin only. Resets the user's password to the default and sets mustChangePassword.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Password reset
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  email:
                    type: string
                required:
                  - success
                  - email
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not an admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /users/{id}/role:
    put:
      operationId: updateUserRole
      tags: [users]
      summary: Update a user's role
      description: Admin only. Sets the user's role to "admin" or "user".
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetRoleRequest"
      responses:
        "200":
          description: Role updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                required:
                  - success
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not an admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /users/activity:
    get:
      operationId: getUserActivity
      tags: [users]
      summary: Get login activity for all users
      description: Admin only. Returns per-user login sessions grouped by day.
      responses:
        "200":
          description: User activity data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserActivityResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not an admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /users/{id}:
    delete:
      operationId: deleteUser
      tags: [users]
      summary: Delete a user
      description: Admin only. Deletes a user account. Cannot delete your own account.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: User deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                required:
                  - success
        "400":
          description: Cannot delete own account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not an admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /imports:
    get:
      operationId: listImports
      tags: [imports]
      summary: List imports
      description: >
        Returns imports in the append-only ledger, newest first, each with its
        parse summary and (when available) a compact change summary versus the prior import.
        By default the list is scoped to the global "valid data starts here" cutoff
        (settings.validFromDate) — imports dated before the cutoff are excluded so the
        whole app agrees on the active window. Pass `all=true` to bypass the cutoff and
        return every import (used by the admin cutoff picker).
      parameters:
        - name: all
          in: query
          required: false
          schema:
            type: boolean
          description: >
            When true, ignore the global WIP cutoff and return every import
            regardless of date. Default false (scoped to the cutoff).
      responses:
        "200":
          description: List of imports
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Import"
    post:
      operationId: uploadImport
      tags: [imports]
      summary: Upload a report
      description: >
        Upload an .xlsx balance/activity report. The server parses Sheet1 (header on row 3),
        forward-fills Project Code, derives mark identifiers, and preserves in-sheet duplicate
        rows. Every upload is appended as a new import. Distinct full rows are deduplicated only
        ACROSS uploads via a permanent record pool; an import records how many copies of each
        pool row it contains. A field-level change set versus the previous import is computed.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/ImportUpload"
      responses:
        "201":
          description: Import created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadResult"
        "400":
          description: Invalid upload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteAllImports
      tags: [imports]
      summary: Delete all data
      description: >
        Permanently deletes ALL imports, their membership rows, and the shared record pool.
        This is a full reset of the dataset and cannot be undone. After this, the app is empty
        and new reports can be uploaded fresh.
      responses:
        "200":
          description: Deletion summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteAllResult"
  /imports/stage:
    post:
      operationId: stageImport
      tags: [imports]
      summary: Stage a raw upload for validation
      description: >
        Accepts ANY uploaded file and holds its raw bytes in a short-lived staging area
        WITHOUT writing to the record pool or imports ledger. Performs a best-effort
        structural read (header detection, columns found vs expected, row count, problems)
        and returns a stagingId used by validate and commit. Nothing is committed here.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/ImportUpload"
      responses:
        "201":
          description: File staged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StageResult"
        "400":
          description: Invalid upload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /imports/validate:
    post:
      operationId: validateStagedImport
      tags: [imports]
      summary: Validate a staged upload with the AI gatekeeper
      description: >
        Sends a compact, descriptive-only sample of the staged file to Claude, which acts as a
        gatekeeper: it returns a verdict (ok | reject) and, when ok, optional descriptive
        sanitize suggestions (never identity/quantity/engine fields). Read-only and advisory:
        it never writes data. When ANTHROPIC_API_KEY is unset, returns available:false so the
        UI can offer "Skip check & import as-is".
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ValidateRequest"
      responses:
        "200":
          description: Validation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationResult"
        "404":
          description: Staged upload not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /imports/commit:
    post:
      operationId: commitStagedImport
      tags: [imports]
      summary: Commit a staged upload
      description: >
        Applies any user-accepted descriptive suggestions to the staged data, then runs the
        SAME deterministic parse + append-only merge as a direct upload, creating a new import.
        The staged row is deleted afterwards. Accepted suggestions only touch descriptive fields
        and never change row identity, quantities, or any computed/engine field.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommitRequest"
      responses:
        "200":
          description: Idempotent commit replay (WIP or Order Review)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommitResult"
        "201":
          description: Import created (WIP or Order Review)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommitResult"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Staged upload not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /imports/stage/{id}:
    delete:
      operationId: discardStagedImport
      tags: [imports]
      summary: Discard a staged upload
      description: Removes a staged upload without committing it. Idempotent.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Staged upload discarded
  /imports/compare:
    get:
      operationId: compareImports
      tags: [imports]
      summary: Compare any two imports
      description: Returns the full field-level change set between two arbitrary imports.
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: integer
        - name: to
          in: query
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: The change set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangeSet"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /imports/{id}:
    get:
      operationId: getImport
      tags: [imports]
      summary: Get an import
      description: Returns a single import with its parse and change summaries.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: The import
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Import"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteImport
      tags: [imports]
      summary: Delete an import
      description: >
        Deletes an import and its membership rows. The shared record pool is permanent and
        is never deleted.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /imports/{id}/records:
    get:
      operationId: getImportRecords
      tags: [imports]
      summary: Get records for an import
      description: >
        Returns the records belonging to an import, expanded by copy count so in-sheet
        duplicates appear as separate pending units. Ageing (days) and route progress are
        recomputed live on every read from the assign date versus today.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Records for the import
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Record"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /imports/{id}/summary:
    post:
      operationId: getImportSummary
      tags: [imports]
      summary: Get a server-computed Overview summary for a filtered import
      description: >
        Computes the Overview page's headline metrics SERVER-SIDE from the
        import's records with the supplied filter set and (optional) resolved
        date window applied, so the client never has to download the full ~40 MB
        records payload just to render the dashboard. The filtering and
        aggregation run the exact same shared code the client uses, so the
        numbers are identical by construction. Purely additive and read-only —
        never changes parsing, activity values, qty, dedup, or ageing math. The
        date window is passed as resolved epoch-ms bounds (computed from the
        client's local "today") so date classification matches the client
        regardless of server timezone.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SummaryRequest"
      responses:
        "200":
          description: Server-computed Overview summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportSummary"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /imports/{id}/movement:
    get:
      operationId: getImportMovement
      tags: [imports]
      summary: Get per-mark days-since-last-movement for an import
      description: >
        For each mark identity in the given import, returns how many days it has
        been since its activity / last-production signature last changed, computed
        by walking the preceding imports. Used (with the live stalledDays setting)
        to flag stalled marks. daysSinceLastMovement is null when there is no prior
        history for that mark (first appearance / no earlier import), so stalled
        detection degrades gracefully until snapshots accumulate.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Per-identity movement info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MovementResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /imports/{id}/velocity:
    get:
      operationId: getImportVelocity
      tags: [imports]
      summary: Get per-mark velocity (pace / ETA / trend) for an import
      description: >
        For each mark identity in the given import, walks the preceding imports to
        build a snapshot series (import date + activity stage + last production
        date) and computes a deterministic VELOCITY: observed pace (days per
        advanced stage), a pace-based ETA, the gap vs the budget target, a trend,
        and a movement status (moving / slow / stalled / insufficient). Purely
        additive and advisory — it never changes parsing, activity values, dedup,
        ageing, or the alert/threshold/lifecycle math. Rolled-up project /
        contractor / stage aggregates are included. Velocity is null per-field when
        there is not enough history (cold start), so it degrades gracefully.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Per-identity velocity info with aggregates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VelocityResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /milestones:
    get:
      operationId: getMilestones
      tags: [imports]
      summary: Get permanent per-project turnaround milestones (Ready / Dispatched)
      description: >
        Deterministically recomputes, from the full append-only import history,
        two PERMANENT per-project turnaround milestones measured from the
        project's earliest Assign Date: MILESTONE 1 "Ready for Dispatch" (the
        first import where no mark remains in an earlier activity C..GB — every
        mark is at Y or gone) and MILESTONE 2 "Dispatched" (the first import where
        the project is entirely absent). Captured dates are preserved
        (capture-once) and persisted, so they survive after a project leaves the
        report. Includes planned (cumulative Y target) vs actual variance.
        Project-less rows ("(Unassigned)") are excluded. Purely additive — never
        changes parsing, activity values, dedup, ageing, warning, or velocity.
      responses:
        "200":
          description: Per-project turnaround milestones
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MilestonesResponse"
  /contractor-movement:
    get:
      operationId: getContractorMovement
      tags: [imports]
      summary: Get the Contractor Performance daily activity-movement ledger
      description: >
        Deterministically recomputes, from the full append-only import
        history (no cutoff), a daily log of how much work (mark count +
        weight) moved from one activity to the next. Credit for a move is
        attributed to the contractor of the FROM activity — the one who
        completed and released that stage. One entry per (date, project,
        contractor, fromActivity, toActivity), already aggregated. Purely
        additive — never changes parsing, activity values, dedup, ageing,
        warning, milestone, or dispatch state.
      responses:
        "200":
          description: Contractor movement ledger entries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContractorMovementResponse"
  /release-balance:
    get:
      operationId: getReleaseBalance
      tags: [imports]
      summary: Get per-structure Release Balance Computed from the latest WIP file
      description: >
        Returns the Release Balance Computed (MT) — the sum of Balance Wt.
        (Col Q) ÷ 1000 for rows where Type (Col A) = "Job Card Not Started"
        AND Job Card Status (Col G) = "Initial" — grouped by (project,
        structure) from the most recently committed WIP file, joined to the
        Order Review file's own stated Release Balance (fileBalReleaseMt) for
        cross-checking. Purely additive — never changes parsing, activity
        values, dedup, ageing, warning, milestone, or dispatch state.
      responses:
        "200":
          description: Release Balance Computed rows and totals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReleaseBalanceResponse"
  /reports/fabrication-project-completion-tlt:
    get:
      operationId: getFabricationProjectCompletionTlt
      tags: [imports]
      summary: Fabrication Report – Project Completion (TLT only)
      description: >
        Returns a per-(project, BOM Label) breakdown of four completion measures
        for TLT marks only: Release Balance Calculated (Job Card Not Started +
        Initial rows), Assignment Balance Calculated (Job Card Not Started + blank
        contractor), Cutting Balance (activity C), and Quality Check Balance
        (activities RFI, NH, B, HAB, W, Q, TS). All weights in MT. BOM Label is
        derived from the Order Review file (Proto / Mass / Pre); structures with
        multiple BOM labels → "Mixed"; no match → "Unknown". Grand totals
        included. Purely additive read — never changes parsing, hashing, dedup,
        ageing, activity, qty, or any other state.
      responses:
        "200":
          description: Fabrication project completion rows and totals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FabricationProjectCompletionResponse"
  /admin/recompute:
    post:
      operationId: adminRecompute
      tags: [admin]
      summary: Manually trigger every deterministic recompute/backfill pass
      description: >
        Re-runs, on demand, every deterministic recompute and backfill pass the
        app otherwise runs automatically (best-effort after upload/delete/
        settings changes, or once at boot): classification backfill, hole-
        operation backfill, milestones, accumulated WIP, contractor movement,
        and dispatch. Every pass is a pure re-derivation from permanent
        append-only history or raw stored columns — nothing here is
        authoritative or destructive, so running it repeatedly is always safe
        and idempotent. Exists purely as a manual fallback (e.g. a prior
        automatic pass failed silently, or the server restarted mid-backfill);
        normal operation never requires it. Requires auth.
      responses:
        "200":
          description: Recompute summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminRecomputeResult"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /order-status:
    get:
      operationId: getOrderStatus
      tags: [orderStatus]
      summary: Get the latest Order Review rows joined to computed dispatch
      description: >
        Returns the latest "Order Review" file ingest (the second input file) as
        per-(project, structure) rows, joined to the computed running Dispatch
        tonnage (seed baseline + Yard-departure accruals), plus a file-vs-computed
        dispatch reconciliation at a 1% tolerance. Fabrication / Galvanizing / Yard
        tonnages are computed client-side from the selected WIP import's records
        (ACTIVITY_BUNDLES) so header filters are honoured. Purely additive and
        read-only — never changes WIP parsing, activity, dedup, ageing, warning,
        velocity, or milestone state. available:false when no Order Review file has
        been ingested yet.
      responses:
        "200":
          description: Order status overlay
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderStatusResponse"
  /order-imports/{id}:
    delete:
      operationId: deleteOrderImport
      tags: [orderStatus]
      summary: Delete one Order Review file from the upload history
      description: >
        Removes a single Order Review upload from the history log. The Order Review
        file is a daily snapshot merged (UPSERTed) into one current order book, so
        deleting a history entry does NOT roll back the current order-book values.
        Deleting the most recent upload re-points the current snapshot rows to the
        now-latest remaining upload. Deleting the last remaining upload clears the
        entire order book (rows + computed dispatch). Purely additive to WIP state —
        never touches WIP parsing, activity, dedup, ageing, warning, or milestone math.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /inventory/buckets:
    get:
      operationId: getInventoryBuckets
      tags: [inventory]
      summary: Get the raw rows behind the Inventory page's auto buckets (B/C/D)
      description: >
        Returns one row per (project, structure) from the latest Order Review
        snapshot, each carrying the two driving numbers (fileBalReleaseMt =
        Balance->Release Col S, inspectionMt = Progress->Inspection Col O) plus
        the distinct contractor names touching that structure in the newest WIP
        import. Server work is kept to this join only — the B/C/D numeric
        filters, null-exclusion flagging, and in-house/out-vendor side
        classification (contractor_categories + hardcoded name overrides) are
        computed client-side so the page's own filters stay in sync with the
        rest of the app. Purely additive and read-only; available:false when no
        Order Review file has been ingested yet.
      responses:
        "200":
          description: Raw joined rows for the Inventory page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryBucketsResponse"
  /inventory-manual/a:
    get:
      operationId: listInventoryManualA
      tags: [inventory]
      summary: List manual Bucket A ("Project to Start") entries
      description: >
        Returns the persisted Bucket A list (free-text project entries the user
        maintains directly on the Inventory page). Survives re-uploads of both
        WIP and Order Review files. Public (read-only).
      responses:
        "200":
          description: Bucket A entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InventoryManualEntry"
    put:
      operationId: upsertInventoryManualA
      tags: [inventory]
      summary: Add or update a manual Bucket A entry
      description: >
        Inserts a new Bucket A entry, or updates one in place when `id` is
        supplied. Requires authentication.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InventoryManualEntryInput"
      responses:
        "200":
          description: Saved entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryManualEntry"
        "400":
          description: Invalid payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Entry not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteInventoryManualA
      tags: [inventory]
      summary: Remove a manual Bucket A entry
      description: >
        Removes one Bucket A entry by id. Requires authentication.
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
  /inventory-manual/e:
    get:
      operationId: listInventoryManualE
      tags: [inventory]
      summary: List manual Bucket E ("Material Ready But Not Dispatched") entries
      description: >
        Returns the persisted Bucket E list (dropdown-picked project entries the
        user maintains directly on the Inventory page). Survives re-uploads of
        both WIP and Order Review files. Public (read-only).
      responses:
        "200":
          description: Bucket E entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InventoryManualEntry"
    put:
      operationId: upsertInventoryManualE
      tags: [inventory]
      summary: Add or update a manual Bucket E entry
      description: >
        Inserts a new Bucket E entry, or updates one in place when `id` is
        supplied. Requires authentication.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InventoryManualEntryInput"
      responses:
        "200":
          description: Saved entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryManualEntry"
        "400":
          description: Invalid payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Entry not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteInventoryManualE
      tags: [inventory]
      summary: Remove a manual Bucket E entry
      description: >
        Removes one Bucket E entry by id. Requires authentication.
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
  /inventory-manual/mfc-colors:
    get:
      operationId: listInventoryMfcColors
      tags: [inventory]
      summary: List backfill colour choices for MFC batches
      description: >
        Returns all stored MFC batch → colour mappings. The colour is applied
        as an Excel cell background when the inventory bucket list is exported.
        Public (read-only).
      responses:
        "200":
          description: MFC colour entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InventoryMfcColor"
    put:
      operationId: upsertInventoryMfcColor
      tags: [inventory]
      summary: Set or replace the backfill colour for an MFC batch
      description: >
        Inserts or replaces the colour assigned to an MFC batch. Requires
        authentication.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InventoryMfcColorInput"
      responses:
        "200":
          description: Saved entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryMfcColor"
        "400":
          description: Invalid payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteInventoryMfcColor
      tags: [inventory]
      summary: Remove the colour assignment for an MFC batch on a specific side
      description: >
        Removes the stored colour for the given MFC batch and side. After
        deletion the batch exports with no background fill for that side.
        Requires authentication.
      parameters:
        - name: mfcBatch
          in: query
          required: true
          schema:
            type: string
        - name: side
          in: query
          required: true
          schema:
            type: string
            enum: [in_house, out_vendor]
      responses:
        "204":
          description: Deleted
  /inventory-manual/side-overrides:
    get:
      operationId: listInventorySideOverrides
      tags: [inventory]
      summary: List permanent side overrides for auto-computed Buckets B/C/D
      description: >
        Returns the full list of stored side overrides (In-House / Out-Vendor)
        for projects in auto-computed Buckets B, C, and D. Overrides are
        applied client-side on every render so the project always appears on
        the correct side regardless of the contractor classification in the
        latest WIP file. Public (read-only).
      responses:
        "200":
          description: Side override entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InventorySideOverride"
    put:
      operationId: upsertInventorySideOverride
      tags: [inventory]
      summary: Create or replace a side override for a project in a given bucket
      description: >
        Inserts a new (projectCode, bucket) override or replaces the existing
        one (upsert). Requires authentication.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InventorySideOverrideInput"
      responses:
        "200":
          description: Saved override
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventorySideOverride"
        "400":
          description: Invalid payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteInventorySideOverride
      tags: [inventory]
      summary: Remove a side override for a project in a given bucket
      description: >
        Removes the stored side override for a (projectCode, bucket) pair.
        After deletion the project falls back to its auto-computed side.
        Requires authentication.
      parameters:
        - name: projectCode
          in: query
          required: true
          schema:
            type: string
        - name: bucket
          in: query
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
  /current-jobs/upload:
    post:
      operationId: uploadCurrentJobs
      tags: [currentJobs]
      summary: Upload a "Current Jobs" list (project codes only)
      description: >
        Parses the first column of the first sheet as a plain list of project
        codes, normalizes them with the same rules used for WIP/Order Review
        project codes, and REPLACES the current list in full (not append).
        Matched/unmatched are computed against the latest WIP import UNION the
        latest Order Review import, for display only -- unmatched codes are
        still stored and still usable by the filter. Requires authentication.
        Purely additive: never touches WIP/Order Review parsing, hash/dedup
        identity, Activity, qty, or ageing.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/CurrentJobsUpload"
      responses:
        "200":
          description: Replaced Current Jobs list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentJobsUploadResponse"
        "400":
          description: Invalid or empty file
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /current-jobs:
    get:
      operationId: getCurrentJobs
      tags: [currentJobs]
      summary: Get the current "Current Jobs" list
      description: >
        Returns the persisted list of project codes (empty array if none
        uploaded or after a clear) plus provenance for the most recent upload.
        Public (read-only) -- drives the "Current Jobs" Job filter option.
      responses:
        "200":
          description: Current Jobs list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentJobsState"
    delete:
      operationId: clearCurrentJobs
      tags: [currentJobs]
      summary: Clear the Current Jobs list
      description: >
        Empties the current list (upload history/provenance is untouched).
        Requires authentication.
      responses:
        "204":
          description: Cleared
  /imports/{id}/changes:
    get:
      operationId: getImportChanges
      tags: [imports]
      summary: Get the change set for an import
      description: >
        Returns the full field-level change set for an import versus the immediately
        preceding import. For the first import, all marks are reported as new.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: The change set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangeSet"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /ai/status:
    get:
      operationId: aiStatus
      tags: [ai]
      summary: Whether the AI layer is configured (advisory)
      description: >
        Optional, advisory-only. Reports whether an Anthropic API key is configured server-side so the
        UI can enable or disable AI assists up front. Returns available:false when ANTHROPIC_API_KEY is
        unset; the deterministic engine is unaffected either way. The key itself is never returned.
      responses:
        "200":
          description: AI availability
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiStatus"
  /ai/sanitize:
    post:
      operationId: aiSanitize
      tags: [ai]
      summary: Suggest descriptive-field cleanups for an import (advisory)
      description: >
        Optional, advisory-only. Asks the model to SUGGEST cleanups for descriptive fields only
        (malformed dates -> YYYY-MM-DD, inconsistent contractor/section spellings canonicalized to
        the most common form, trimmed whitespace, obvious typos). It never touches balanceQty,
        balanceWt, activity, operation, markId, or any hashed identity input, and it never applies
        changes - only returns a diff list. If ANTHROPIC_API_KEY is unset the endpoint responds with
        available:false and an empty suggestion list; the deterministic engine is unaffected.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SanitizeRequest"
      responses:
        "200":
          description: Sanitize suggestions (or available:false when AI is disabled)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SanitizeResult"
        "404":
          description: Import not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /ai/review:
    post:
      operationId: aiReview
      tags: [ai]
      summary: AI consistency review of an import's results (advisory, read-only)
      description: >
        Optional, advisory-only and read-only. Sends the parsed-records summary and the deterministic
        change set (versus the previous import, or versus compareTo when given) and asks the model to
        AUDIT consistency (ageing math, unknown activity codes, activity not in its operation route,
        null contractor/date, backward route moves, qty increases, mass contractor reassignment, a
        flood of completed marks). Returns a verdict, summary, stats, and findings. When the standard
        verdict is not "pass" or deep is requested, a deeper model pass adds a prioritized plan. The
        AI never writes to record_pool, import_rows, or any computed field. If ANTHROPIC_API_KEY is
        unset the endpoint responds with available:false; the deterministic engine is unaffected.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewRequest"
      responses:
        "200":
          description: Review result (or available:false when AI is disabled)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewResult"
        "404":
          description: Import not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /ai/report:
    post:
      operationId: aiReport
      tags: [ai]
      summary: Deep turnaround-time analytical report for an import (advisory, read-only)
      description: >
        Optional, advisory-only and read-only. The server pre-computes a compact, deterministic
        analytics pack from the selected import's records (ageing = today - lastProductionDate): totals,
        ageing buckets, by-activity / by-contractor / by-job / by-structure aggregates, WIP
        concentration, top stale items, data-quality notes, and change-set deltas versus the previous
        import (or compareTo). That pack - never the raw rows - is sent to the model, which acts as a
        fabrication-operations analyst and returns a structured turnaround report (summary, action
        plan, detailed analysis). Optional filters restrict the analysis to a slice. The AI never
        writes to record_pool, import_rows, or any computed field. If ANTHROPIC_API_KEY is unset the
        endpoint responds with available:false; the deterministic engine is unaffected.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportRequest"
      responses:
        "200":
          description: Turnaround report (or available:false when AI is disabled)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportResult"
        "404":
          description: Import not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    AuthCredentials:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
      required:
        - email
        - password
    AuthStatus:
