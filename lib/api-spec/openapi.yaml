    ProductionMovementResponse:
      type: object
      description: >
        Cutting output (mark-level TLT) and net balance delta per activity for
        consecutive import pairs. Days are in chronological order (oldest first).
      properties:
        days:
          type: array
          items:
            $ref: "#/components/schemas/ProductionMovementDay"
      required:
        - days
    ProductionMovementDay:
      type: object
      description: >
        One consecutive import pair. cuttingOutputMt is the sum of TLT balance
        weight drawn down from marks that were at activity C in the previous
        import (left C entirely, or still at C with reduced weight). netBalance
        maps activity code to MT delta (curr − prev); negative = clearing,
        positive = accumulating. isGap=true when the two imports are more than
        one calendar day apart. gated=true when either import in the pair
        pre-dates per-row Type/Status storage; in that case cuttingOutputMt=0
        and netBalance={} — the pair cannot be computed.
      properties:
        importId:
          type: integer
          description: ID of the current (newer) import.
        dayKey:
          type: string
          description: YYYY-MM-DD of the current import (reportDate, else createdAt UTC date).
        dayLabel:
          type: string
          description: Human-readable label, e.g. "20 Jul" or "18-20 Jul (2d)".
        prevImportId:
          type: integer
          description: ID of the previous (older) import.
        prevDayKey:
          type: string
          description: YYYY-MM-DD of the previous import.
        isGap:
          type: boolean
          description: True when the two imports are more than one calendar day apart.
        elapsedDays:
          type: integer
          description: Calendar days between the two import dates.
        cuttingOutputMt:
          type: number
          description: >
            Mark-level TLT cutting output in MT. Sum of balance weight of marks
            that left C entirely plus the weight reduction of marks still at C.
            Excludes marks entering C (intake) and weight increases (corrections).
        cuttingMarksLeft:
          type: integer
          description: Count of TLT marks that were at C in prev and are no longer at C in curr.
        cuttingMarksReduced:
          type: integer
          description: Count of TLT marks still at C in both imports whose balance weight decreased.
        netBalance:
          type: object
          description: >
            Net balance delta in MT per activity (curr balance − prev balance).
            Negative = material leaving (good); positive = material accumulating (potential bottleneck).
            Key "FG" is derived from parseSummary fgWipByJob. Empty ({}) when gated=true.
          additionalProperties:
            type: number
        gated:
          type: boolean
          description: >-
            True when either import in this pair pre-dates per-row Type/Status storage.
            Movement cannot be computed; cuttingOutputMt and netBalance are zeroed.
        gatedReason:
          type: string
          description: Names the specific unusable import when gated is true.
      required:
        - importId
        - dayKey
        - dayLabel
        - prevImportId
        - prevDayKey
        - isGap
        - elapsedDays
        - cuttingOutputMt
        - cuttingMarksLeft
        - cuttingMarksReduced
        - netBalance
    ContractorBalanceMovementResponse:
      type: object
      description: Per-contractor balance movement across consecutive import pairs.
      properties:
        days:
          type: array
          items:
            $ref: "#/components/schemas/ContractorBalanceMovementDay"
      required:
        - days
    ContractorBalanceMeasures:
      type: object
      description: Five balance-movement measures for one contractor in one consecutive import pair.
      properties:
        produced:
          type: number
          description: >
            MT actually drawn down by this contractor — same-contractor weight
            reductions plus marks that fully left WIP. Excludes reassignments,
            new intake, and weight increases (corrections). Always >= 0.
        received:
          type: number
          description: MT of marks reassigned IN to this contractor from another.
        released:
          type: number
          description: MT of marks reassigned OUT from this contractor to another.
        newIntake:
          type: number
          description: MT of marks appearing for the first time in the current snapshot, attributed to this contractor.
        netChange:
          type: number
          description: >
            Overall balance delta in MT (curr total − prev total for this
            contractor). Positive = workload growing; negative = clearing.
            Reconciles as: netChange = -produced + received - released + newIntake + increases.
      required:
        - produced
        - received
        - released
        - newIntake
        - netChange
    ImportDeletionLogEntry:
      type: object
      description: One entry in the import deletion audit log.
      properties:
        id:
          type: integer
        importId:
          type: ["integer", "null"]
          description: Original import id at time of deletion.
        fileType:
          type: string
          description: '"wip" or "order-review"'
        sourceFilename:
          type: string
        reportDate:
          type: ["string", "null"]
          description: The as-on / report date of the file (YYYY-MM-DD).
        deletedAt:
          type: string
          description: ISO timestamp of when the deletion occurred.
        deletedBy:
          type: string
          description: Display name or email of the user who deleted the file.
      required:
        - id
        - fileType
        - sourceFilename
        - deletedAt
        - deletedBy
    ContractorAlias:
      type: object
      description: >
        A single approved alias mapping. The normalized aliasKey resolves to
        the canonical contractor_categories nameKey via this table.
      properties:
        aliasKey:
          type: string
          description: normalizeContractorName(rawName) — the join key used in WIP rows.
        canonicalKey:
          type: string
          description: The nameKey of the canonical contractor_categories entry.
        rawName:
          type: string
          description: Original raw string as it appeared in the WIP file (for display).
        createdAt:
          type: string
      required:
        - aliasKey
        - canonicalKey
        - rawName
    ContractorAliasEntry:
      type: object
      description: One alias within a dedup proposal.
      properties:
        rawName:
          type: string
        normalizedKey:
          type: string
      required:
        - rawName
        - normalizedKey
    ContractorDedupProposal:
      type: object
      description: >
        One AI-generated or upload-triggered merge proposal awaiting human review.
        status: pending | approved | rejected.
        confidence: 0–1 from the AI (null for upload-triggered proposals).
      properties:
        id:
          type: integer
        canonicalKey:
          type: string
        canonicalDisplay:
          type: string
        aliasEntries:
          type: array
          items:
            $ref: "#/components/schemas/ContractorAliasEntry"
        confidence:
          type: ["number", "null"]
          minimum: 0
          maximum: 1
        reason:
          type: ["string", "null"]
        status:
          type: string
          enum: [pending, approved, rejected]
        createdAt:
          type: string
        reviewedAt:
          type: ["string", "null"]
      required:
        - id
        - canonicalKey
        - canonicalDisplay
        - aliasEntries
        - status
        - createdAt
    ContractorDedupPendingCount:
      type: object
      properties:
        count:
          type: integer
      required:
        - count
    ContractorDedupAnalyzeResult:
      type: object
      properties:
        proposals:
          type: array
          items:
            $ref: "#/components/schemas/ContractorDedupProposal"
        message:
          type: string
      required:
        - proposals
    ContractorBalanceMovementDay:
      type: object
      description: One consecutive import pair's per-contractor movement measures.
      properties:
        importId:
          type: integer
          description: ID of the current (newer) import.
        dayKey:
          type: string
          description: YYYY-MM-DD of the current import.
        dayLabel:
          type: string
          description: Human-readable label, e.g. "20 Jul" or "18-20 Jul (2d)".
        prevImportId:
          type: integer
          description: ID of the previous (older) import.
        prevDayKey:
          type: string
          description: YYYY-MM-DD of the previous import.
        isGap:
          type: boolean
          description: True when the two imports are more than one calendar day apart.
        elapsedDays:
          type: integer
          description: Calendar days between the two import dates.
        contractors:
          type: object
          description: Map of contractor name to movement measures. Blank contractor appears as "(Unassigned)".
          additionalProperties:
            $ref: "#/components/schemas/ContractorBalanceMeasures"
      required:
        - importId
        - dayKey
        - dayLabel
        - prevImportId
        - prevDayKey
        - isGap
        - elapsedDays
        - contractors
