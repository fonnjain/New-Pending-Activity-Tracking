        metric:
          type: string
        finding:
          type: string
      required:
        - area
        - name
        - metric
        - finding
    ReportDetailed:
      type: object
      properties:
        bottlenecks:
          type: array
          items:
            $ref: "#/components/schemas/ReportBottleneck"
        ageingAnalysis:
          type: string
        contractorAnalysis:
          type: string
        throughput:
          type: string
        dataQuality:
          type: array
          items:
            type: string
        assumptions:
