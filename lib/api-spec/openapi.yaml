    TurnaroundSettings:
      type: object
      description: App-level turnaround-warning configuration. Singleton; global per-activity ideal days, grace cells and pre-warning thresholds keyed by canonical activity code, plus optional sparse per-project overrides and the stalled-mark threshold.
      properties:
        activities:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/ActivityConfig"
          description: Global ("All Projects") per-activity config keyed by canonical activity code (PROCESS_SEQUENCE). This is the TLT category.
        perProject:
          type: object
          additionalProperties:
            type: object
            additionalProperties:
              $ref: "#/components/schemas/PartialActivityConfig"
          description: >
            Sparse per-project overrides keyed by project (Job) then canonical
            activity code. Only overridden cells/fields are stored; everything
            else inherits `activities`.
        ntlt:
          type: object
          description: >
            The three NTLT categories' configs keyed by subtype (RSJ, EARTHING,
            GENERAL). TLT stays at the top level (activities/perProject). Seeded
            with defaults on read.
          properties:
            RSJ:
              $ref: "#/components/schemas/CategorySettings"
            EARTHING:
              $ref: "#/components/schemas/CategorySettings"
            GENERAL:
              $ref: "#/components/schemas/CategorySettings"
        stalledDays:
          type: number
          description: >
            Stalled-mark threshold in days. A mark whose activity/last-production
            signature has not changed for >= this many days is flagged stalled.
        validFromDate:
          type: ["string", "null"]
          pattern: '^\d{4}-\d{2}-\d{2}$'
          description: >
            Global "valid data starts here" WIP cutoff (YYYY-MM-DD) or null
            (default = no cutoff). When set, the whole app — client selection AND
            every server-side history replay (change log, movement, velocity,
            milestones, dispatch) — considers only WIP imports dated (report
            date, else upload date) on/after this day; older imports are ignored
            as if never uploaded. Scoping only: never touches parsing, activity,
            qty, dedup/hash identity, or ageing math.
      required:
        - activities
