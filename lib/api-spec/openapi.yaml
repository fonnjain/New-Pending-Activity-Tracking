openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Login/logout and session status for the protected Data view
  - name: imports
    description: Import, merge, and change-log operations
  - name: ai
    description: Optional, advisory-only AI assists (sanitize suggestions and consistency review)
  - name: settings
    description: App-level turnaround-warning configuration (ideal days, grace bands)
paths:
  /settings:
    get:
      operationId: getSettings
      tags: [settings]
      summary: Get turnaround settings
      description: >
        Returns the singleton turnaround-warning configuration: a per-activity
        map where each PROCESS_SEQUENCE activity has its own ideal days plus
        yellow/orange/red grace bands. When nothing has been saved yet, returns
        the built-in defaults. Public (read-only).
      responses:
        "200":
          description: Current turnaround settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TurnaroundSettings"
    put:
      operationId: updateSettings
      tags: [settings]
      summary: Update turnaround settings
      description: >
        Upserts the singleton turnaround-warning configuration. Requires
        authentication. Bands are validated and normalized server-side
        (non-negative; yellow <= orange <= red) and the normalized object is
        echoed back.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TurnaroundSettings"
      responses:
        "200":
          description: Saved turnaround settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TurnaroundSettings"
        "400":
          description: Invalid settings payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /rsj-thickness:
    get:
      operationId: listRsjThickness
      tags: [thickness]
      summary: List RSJ thickness lookup entries
      description: >
        Returns the RSJ Types & Thickness lookup table (cleaned "RSJ <dims>"
        group key -> thickness in mm). Used to auto-resolve thickness for NTLT/RSJ
        marks. Public (read-only).
      responses:
        "200":
          description: RSJ thickness entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RsjThickness"
    put:
      operationId: upsertRsjThickness
      tags: [thickness]
      summary: Create or update an RSJ thickness entry
      description: >
        Upserts one RSJ lookup entry keyed by the cleaned "RSJ <dims>" group key.
        Requires authentication. RSJ marks with this group key resolve to the new
        thickness on the next read (live recompute).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RsjThicknessInput"
      responses:
        "200":
          description: Saved entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RsjThickness"
        "400":
          description: Invalid payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteRsjThickness
      tags: [thickness]
      summary: Delete an RSJ thickness entry
      description: >
        Removes one RSJ lookup entry. Requires authentication. The group key is
        passed as a query param (it can contain spaces) to avoid path-segment
        encoding issues.
      parameters:
        - name: groupKey
          in: query
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
  /manual-thickness:
    get:
      operationId: listManualThickness
      tags: [thickness]
      summary: List manual thickness pins
      description: >
        Returns manual thickness values keyed by mark_id (used for NTLT/GENERAL
        and any hand-pinned mark). These survive re-imports. Public (read-only).
      responses:
        "200":
          description: Manual thickness entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ManualThickness"
    put:
      operationId: upsertManualThickness
      tags: [thickness]
      summary: Create or update a manual thickness pin
      description: >
        Upserts one manual thickness value keyed by mark_id. Requires
        authentication. The mark resolves to this value (source "manual") on the
        next read and the value persists across re-imports.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManualThicknessInput"
      responses:
        "200":
          description: Saved entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManualThickness"
        "400":
          description: Invalid payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteManualThickness
      tags: [thickness]
      summary: Delete a manual thickness pin
      description: >
        Removes one manual thickness pin (the mark reverts to auto/unset).
        Requires authentication. The mark id is passed as a query param (it can
        contain backslashes and spaces) to avoid path-segment encoding issues.
      parameters:
        - name: markId
          in: query
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
  /contractor-categories:
    get:
      operationId: listContractorCategories
      tags: [contractorCategories]
      summary: List contractor sub-category mappings
      description: >
        Returns the contractor sub-category overlay (normalized name key ->
        category + FAB/GALVA tags). Joined to records at read time; never changes
        parsing, ageing, dedup, qty, or the contractor string. Public (read-only).
      responses:
        "200":
          description: Contractor sub-category entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ContractorCategory"
    put:
      operationId: upsertContractorCategory
      tags: [contractorCategories]
      summary: Create or update a contractor sub-category mapping
      description: >
        Upserts one contractor mapping keyed by the normalized contractor name.
        Requires authentication. Records for this contractor resolve to the new
        category/tags on the next read (live join).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContractorCategoryInput"
      responses:
        "200":
          description: Saved entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContractorCategory"
        "400":
          description: Invalid payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteContractorCategory
      tags: [contractorCategories]
      summary: Delete a contractor sub-category mapping
      description: >
        Removes one contractor mapping (the contractor reverts to Unclassified).
        Requires authentication. The name key is passed as a query param (it can
        contain spaces and punctuation) to avoid path-segment encoding issues.
      parameters:
        - name: nameKey
          in: query
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/me:
    get:
      operationId: getAuthStatus
      tags: [auth]
      summary: Current authentication status
      description: >
        Returns whether the current request carries a valid signed session cookie.
        Used by the frontend to gate the Data view behind login.
      responses:
        "200":
          description: Authentication status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthStatus"
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Log in
      description: >
        Validates the submitted email and password against the server-side
        AUTH_EMAIL/AUTH_PASSWORD credentials. On success, sets a signed, httpOnly
        session cookie. Returns 401 on invalid credentials and 503 when no
        credentials are configured on the server.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthCredentials"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthStatus"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Login not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Log out
      description: Clears the session cookie.
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthStatus"
  /imports:
    get:
      operationId: listImports
      tags: [imports]
      summary: List imports
      description: >
        Returns every import in the append-only ledger, newest first, each with its
        parse summary and (when available) a compact change summary versus the prior import.
      responses:
        "200":
          description: List of imports
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Import"
    post:
      operationId: uploadImport
      tags: [imports]
      summary: Upload a report
      description: >
        Upload an .xlsx balance/activity report. The server parses Sheet1 (header on row 3),
        forward-fills Project Code, derives mark identifiers, and preserves in-sheet duplicate
        rows. Every upload is appended as a new import. Distinct full rows are deduplicated only
        ACROSS uploads via a permanent record pool; an import records how many copies of each
        pool row it contains. A field-level change set versus the previous import is computed.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/ImportUpload"
      responses:
        "201":
          description: Import created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadResult"
        "400":
          description: Invalid upload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteAllImports
      tags: [imports]
      summary: Delete all data
      description: >
        Permanently deletes ALL imports, their membership rows, and the shared record pool.
        This is a full reset of the dataset and cannot be undone. After this, the app is empty
        and new reports can be uploaded fresh.
      responses:
        "200":
          description: Deletion summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteAllResult"
  /imports/stage:
    post:
      operationId: stageImport
      tags: [imports]
      summary: Stage a raw upload for validation
      description: >
        Accepts ANY uploaded file and holds its raw bytes in a short-lived staging area
        WITHOUT writing to the record pool or imports ledger. Performs a best-effort
        structural read (header detection, columns found vs expected, row count, problems)
        and returns a stagingId used by validate and commit. Nothing is committed here.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/ImportUpload"
      responses:
        "201":
          description: File staged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StageResult"
        "400":
          description: Invalid upload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /imports/validate:
    post:
      operationId: validateStagedImport
      tags: [imports]
      summary: Validate a staged upload with the AI gatekeeper
      description: >
        Sends a compact, descriptive-only sample of the staged file to Claude, which acts as a
        gatekeeper: it returns a verdict (ok | reject) and, when ok, optional descriptive
        sanitize suggestions (never identity/quantity/engine fields). Read-only and advisory:
        it never writes data. When ANTHROPIC_API_KEY is unset, returns available:false so the
        UI can offer "Skip check & import as-is".
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ValidateRequest"
      responses:
        "200":
          description: Validation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationResult"
        "404":
          description: Staged upload not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /imports/commit:
    post:
      operationId: commitStagedImport
      tags: [imports]
      summary: Commit a staged upload
      description: >
        Applies any user-accepted descriptive suggestions to the staged data, then runs the
        SAME deterministic parse + append-only merge as a direct upload, creating a new import.
        The staged row is deleted afterwards. Accepted suggestions only touch descriptive fields
        and never change row identity, quantities, or any computed/engine field.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommitRequest"
      responses:
        "201":
          description: Import created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadResult"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Staged upload not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /imports/stage/{id}:
    delete:
      operationId: discardStagedImport
      tags: [imports]
      summary: Discard a staged upload
      description: Removes a staged upload without committing it. Idempotent.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Staged upload discarded
  /imports/compare:
    get:
      operationId: compareImports
      tags: [imports]
      summary: Compare any two imports
      description: Returns the full field-level change set between two arbitrary imports.
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: integer
        - name: to
          in: query
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: The change set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangeSet"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /imports/{id}:
    get:
      operationId: getImport
      tags: [imports]
      summary: Get an import
      description: Returns a single import with its parse and change summaries.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: The import
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Import"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteImport
      tags: [imports]
      summary: Delete an import
      description: >
        Deletes an import and its membership rows. The shared record pool is permanent and
        is never deleted.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /imports/{id}/records:
    get:
      operationId: getImportRecords
      tags: [imports]
      summary: Get records for an import
      description: >
        Returns the records belonging to an import, expanded by copy count so in-sheet
        duplicates appear as separate pending units. Ageing (days) and route progress are
        recomputed live on every read from the assign date versus today.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Records for the import
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Record"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /imports/{id}/movement:
    get:
      operationId: getImportMovement
      tags: [imports]
      summary: Get per-mark days-since-last-movement for an import
      description: >
        For each mark identity in the given import, returns how many days it has
        been since its activity / last-production signature last changed, computed
        by walking the preceding imports. Used (with the live stalledDays setting)
        to flag stalled marks. daysSinceLastMovement is null when there is no prior
        history for that mark (first appearance / no earlier import), so stalled
        detection degrades gracefully until snapshots accumulate.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Per-identity movement info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MovementResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /imports/{id}/velocity:
    get:
      operationId: getImportVelocity
      tags: [imports]
      summary: Get per-mark velocity (pace / ETA / trend) for an import
      description: >
        For each mark identity in the given import, walks the preceding imports to
        build a snapshot series (import date + activity stage + last production
        date) and computes a deterministic VELOCITY: observed pace (days per
        advanced stage), a pace-based ETA, the gap vs the budget target, a trend,
        and a movement status (moving / slow / stalled / insufficient). Purely
        additive and advisory — it never changes parsing, activity values, dedup,
        ageing, or the alert/threshold/lifecycle math. Rolled-up project /
        contractor / stage aggregates are included. Velocity is null per-field when
        there is not enough history (cold start), so it degrades gracefully.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Per-identity velocity info with aggregates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VelocityResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /milestones:
    get:
      operationId: getMilestones
      tags: [imports]
      summary: Get permanent per-project turnaround milestones (Ready / Dispatched)
      description: >
        Deterministically recomputes, from the full append-only import history,
        two PERMANENT per-project turnaround milestones measured from the
        project's earliest Assign Date: MILESTONE 1 "Ready for Dispatch" (the
        first import where no mark remains in an earlier activity C..GB — every
        mark is at Y or gone) and MILESTONE 2 "Dispatched" (the first import where
        the project is entirely absent). Captured dates are preserved
        (capture-once) and persisted, so they survive after a project leaves the
        report. Includes planned (cumulative Y target) vs actual variance.
        Project-less rows ("(Unassigned)") are excluded. Purely additive — never
        changes parsing, activity values, dedup, ageing, warning, or velocity.
      responses:
        "200":
          description: Per-project turnaround milestones
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MilestonesResponse"
  /imports/{id}/changes:
    get:
      operationId: getImportChanges
      tags: [imports]
      summary: Get the change set for an import
      description: >
        Returns the full field-level change set for an import versus the immediately
        preceding import. For the first import, all marks are reported as new.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: The change set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangeSet"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /ai/status:
    get:
      operationId: aiStatus
      tags: [ai]
      summary: Whether the AI layer is configured (advisory)
      description: >
        Optional, advisory-only. Reports whether an Anthropic API key is configured server-side so the
        UI can enable or disable AI assists up front. Returns available:false when ANTHROPIC_API_KEY is
        unset; the deterministic engine is unaffected either way. The key itself is never returned.
      responses:
        "200":
          description: AI availability
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiStatus"
  /ai/sanitize:
    post:
      operationId: aiSanitize
      tags: [ai]
      summary: Suggest descriptive-field cleanups for an import (advisory)
      description: >
        Optional, advisory-only. Asks the model to SUGGEST cleanups for descriptive fields only
        (malformed dates -> YYYY-MM-DD, inconsistent contractor/section spellings canonicalized to
        the most common form, trimmed whitespace, obvious typos). It never touches balanceQty,
        balanceWt, activity, operation, markId, or any hashed identity input, and it never applies
        changes - only returns a diff list. If ANTHROPIC_API_KEY is unset the endpoint responds with
        available:false and an empty suggestion list; the deterministic engine is unaffected.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SanitizeRequest"
      responses:
        "200":
          description: Sanitize suggestions (or available:false when AI is disabled)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SanitizeResult"
        "404":
          description: Import not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /ai/review:
    post:
      operationId: aiReview
      tags: [ai]
      summary: AI consistency review of an import's results (advisory, read-only)
      description: >
        Optional, advisory-only and read-only. Sends the parsed-records summary and the deterministic
        change set (versus the previous import, or versus compareTo when given) and asks the model to
        AUDIT consistency (ageing math, unknown activity codes, activity not in its operation route,
        null contractor/date, backward route moves, qty increases, mass contractor reassignment, a
        flood of completed marks). Returns a verdict, summary, stats, and findings. When the standard
        verdict is not "pass" or deep is requested, a deeper model pass adds a prioritized plan. The
        AI never writes to record_pool, import_rows, or any computed field. If ANTHROPIC_API_KEY is
        unset the endpoint responds with available:false; the deterministic engine is unaffected.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewRequest"
      responses:
        "200":
          description: Review result (or available:false when AI is disabled)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewResult"
        "404":
          description: Import not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /ai/report:
    post:
      operationId: aiReport
      tags: [ai]
      summary: Deep turnaround-time analytical report for an import (advisory, read-only)
      description: >
        Optional, advisory-only and read-only. The server pre-computes a compact, deterministic
        analytics pack from the selected import's records (ageing = today - lastProductionDate): totals,
        ageing buckets, by-activity / by-contractor / by-job / by-structure aggregates, WIP
        concentration, top stale items, data-quality notes, and change-set deltas versus the previous
        import (or compareTo). That pack - never the raw rows - is sent to the model, which acts as a
        fabrication-operations analyst and returns a structured turnaround report (summary, action
        plan, detailed analysis). Optional filters restrict the analysis to a slice. The AI never
        writes to record_pool, import_rows, or any computed field. If ANTHROPIC_API_KEY is unset the
        endpoint responds with available:false; the deterministic engine is unaffected.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportRequest"
      responses:
        "200":
          description: Turnaround report (or available:false when AI is disabled)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportResult"
        "404":
          description: Import not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    AuthCredentials:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
      required:
        - email
        - password
    AuthStatus:
      type: object
      properties:
        authenticated:
          type: boolean
      required:
        - authenticated
    ImportUpload:
      type: object
      properties:
        file:
          type: string
          format: binary
        label:
          type: string
        reportDate:
          type: string
      required:
        - file
    ParseSummary:
      type: object
      properties:
