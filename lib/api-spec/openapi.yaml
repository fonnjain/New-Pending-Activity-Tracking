    InventoryBucketRow:
      type: object
      description: >
        One (project, structure) row from the latest Order Review snapshot,
        joined to the distinct contractors touching that structure in the
        newest WIP import. Raw only — the client derives B/C/D membership and
        in-house/out-vendor sides from these fields.
      properties:
        project:
          type: string
        structure:
          type: string
          nullable: true
        subType:
          type: string
          nullable: true
        weightMt:
          type: number
          nullable: true
        woOrderQtyMt:
          type: number
          nullable: true
        fileBalReleaseMt:
          type: number
          nullable: true
          description: Balance -> Release (Col S). Drives Bucket B (>0) / Bucket C (<=0).
        inspectionMt:
          type: number
          nullable: true
          description: Progress -> Inspection (Col O). Drives Bucket D (>0).
        contractors:
          type: array
          items:
            type: string
          description: Distinct contractor names touching this structure in the newest WIP import.
        notInLatest:
          type: boolean
          description: True when this row was last touched by an earlier Order Review upload, not the newest one.
      required:
        - project
        - structure
        - subType
        - weightMt
        - woOrderQtyMt
        - fileBalReleaseMt
        - inspectionMt
        - contractors
        - notInLatest
