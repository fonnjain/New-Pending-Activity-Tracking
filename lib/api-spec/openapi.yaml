            type: string
          description: Set-membership job filter ("Current Jobs" mode). When present, checked INSTEAD of `job`.
        section:
          type: ["string", "null"]
        mfcBatch:
          type: ["string", "null"]
        structure:
          type: ["string", "null"]
        mark:
          type: ["string", "null"]
        contractor:
          type: ["string", "null"]
        contractorCategory:
          type: ["string", "null"]
        outVendorType:
          type: ["string", "null"]
        activity:
          type: ["string", "null"]
        holeOperation:
          type: ["string", "null"]
        search:
          type: string
      required:
        - category
        - search
    SummaryDateWindow:
      type: object
      description: >-
        Resolved date window as calendar day keys (YYYYMMDD integers); start is
        inclusive, end is exclusive. Day keys are timezone-independent so the
        server filters identically to the client regardless of its timezone.
      properties:
        start:
          type: number
        end:
          type: number
      required:
        - start
        - end
    SummaryRequest:
      type: object
      properties:
        filters:
          $ref: "#/components/schemas/SummaryFilters"
        dateWindow:
          oneOf:
            - $ref: "#/components/schemas/SummaryDateWindow"
            - type: "null"
          description: Resolved date window (client computes from local today); null = no date filter.
      required:
        - filters
    SummaryTopAgedMark:
      type: object
