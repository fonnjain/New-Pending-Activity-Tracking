    Record:
      type: object
      properties:
        id:
          type: integer
        importId:
          type: integer
        hash:
          type: string
          description: Full-row SHA-256 content hash; identical full rows share a hash.
        markId:
          type: string
        job:
          type: string
        structure:
          type: string
        markTail:
          type: string
        markNo:
          type: string
        alias:
          type: ["string", "null"]
        section:
          type: ["string", "null"]
        jobCardNo:
          type: ["string", "null"]
        towerType:
          type: ["string", "null"]
        towerSubType:
          type: ["string", "null"]
        length:
          type: ["number", "null"]
        width:
          type: ["number", "null"]
        wtPcs:
          type: ["number", "null"]
        balanceQty:
          type: number
        balanceWt:
          type: number
        activity:
          type: ["string", "null"]
        operation:
          type: ["string", "null"]
        assignDate:
          type: ["string", "null"]
        lastProductionDate:
          type: ["string", "null"]
          description: Last Production Entry Date (col S); drives ageing. Null when blank/unparseable.
        contractor:
          type: ["string", "null"]
        orderNature:
          type: ["string", "null"]
        refJobCardNo:
          type: ["string", "null"]
        workOrderNo:
          type: ["string", "null"]
          description: Work Order No. (col T). Stored only; not used in logic yet. Part of the row hash.
        mfcBatch:
          type: string
          description: MFC batch (WO Batch No., col U), normalized (trim/uppercase). Blank -> "Z" so blanks group/sort after real batches. Raw pre-"Z" value is part of the row hash.
        ageingDays:
          type: ["integer", "null"]
          description: today - lastProductionDate (whole days; future clamped to 0). Null when no production date.
        routeSteps:
          type: array
          items:
            type: string
        currentStepIndex:
          type: ["integer", "null"]
        category:
          type: ["string", "null"]
          description: Mark category — "TLT" | "NTLT" | null. Drives the per-category process sequence.
        ntltSubtype:
          type: ["string", "null"]
          description: NTLT subtype — "RSJ" | "EARTHING" | "GENERAL" | null (null for TLT/unknown).
        groupKey:
          type: ["string", "null"]
          description: Resolved grouping key (TLT = job; NTLT = cleaned section / "RSJ <dims>").
        active:
          type: boolean
          description: Whether the mark participates in workflow metrics (false for FOUNDATION BOLT).
        thicknessMm:
          type: ["number", "null"]
          description: Live-resolved galvanizing thickness (mm). Null when unset/unparseable. Never stored on the pool row, never in the hash.
        thicknessSource:
          type: string
          enum: [tlt_angle, tlt_plate, rsj_exact, rsj_base, rsj_default, manual, unset]
          description: How thicknessMm was derived (or "unset" when not yet resolved).
        sectionType:
          type: ["string", "null"]
          enum: [ANGLE, PLATE, CHANNEL, BEAM, RSJ, FLAT, PIPE, ROUND, GRATING, OTHER, null]
          description: Derived section family from the Section string. Null only on legacy rows pending backfill.
        holeOperation:
          type: ["string", "null"]
          enum: [PUNCHING, DRILLING, NOT_SET, null]
          description: Derived hole operation. Channel/Beam/RSJ always DRILLING; Angle/Plate by thickness (<=12 PUNCHING, >12 DRILLING); else NOT_SET. Not in the row hash.
        fg:
          type: ["string", "null"]
          description: Finished Goods placeholder. Blank (null) everywhere for now — not in any process sequence/bundle and not in the row hash. Reserved for future use.
        isInitialCutting:
          type: boolean
          description: >
            True when Type="Job Card Not Started" AND Job Card Status="Initial". These marks
            are already counted as Release Balance and must NOT contribute to any Cutting (C)
            balance figure. Additive, not hashed. Backfilled for existing rows via the proxy
            activity='C' AND assign_date IS NULL AND contractor IS NULL.
      required:
        - id
        - importId
        - hash
        - markId
        - job
        - structure
        - markTail
        - markNo
        - alias
        - section
        - jobCardNo
        - towerType
        - towerSubType
        - length
        - width
        - wtPcs
        - balanceQty
        - balanceWt
        - activity
        - operation
        - assignDate
        - lastProductionDate
        - contractor
        - orderNature
        - refJobCardNo
        - workOrderNo
        - mfcBatch
        - ageingDays
        - routeSteps
        - currentStepIndex
        - category
        - ntltSubtype
        - groupKey
        - active
        - isInitialCutting
    SummaryFilters:
      type: object
      description: >
        The active filter slots that determine which records are included. Mirrors
        the frontend filter state. Empty/null slots impose no constraint.
      properties:
        category:
          type: string
          description: Order-type mode — "ALL" | "TLT" | "NTLT".
