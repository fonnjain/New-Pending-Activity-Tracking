        - jobCardNo
        - job
        - contractor
        - activity
        - ageingDays
        - status
        - trend
        - daysPerStage
        - expectedDaysPerStage
        - stagesRemaining
        - etaDays
        - etaGap
        - observedWindowDays
        - snapshotsUsed
        - daysSinceLastMovement
        - insufficientHistory
    VelocityProjectAgg:
