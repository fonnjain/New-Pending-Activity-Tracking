    ParseSummary:
      type: object
      properties:
        rowsRead:
          type: integer
        rowsKept:
          type: integer
        distinctRows:
          type: integer
        duplicateRowCopies:
          type: integer
        projectsFound:
          type: integer
        missingContractor:
          type: integer
        missingDate:
          type: integer
        notStarted:
          type: integer
          description: Blank Last Production Entry Date AND activity == C (production not begun).
        noProductionDate:
          type: integer
          description: Blank Last Production Entry Date AND activity != C (progressed past cutting; data-quality flag).
        futureProductionDate:
          type: integer
          description: Last Production Entry Date later than today (clamped to today for ageing).
        ntltOrphanCount:
          type: integer
          description: >
            NTLT marks (RSJ POLE / EARTHING / GENERAL) with no project code,
            attributed to "(Unassigned)" grouped by Section. Absent when zero
            such rows exist.
        ntltOrphanWtMt:
          type: number
          description: >
            Total Balance Wt. (MT) of the NTLT orphan marks (same rows as
            ntltOrphanCount). Absent when ntltOrphanCount is absent.
        fgWipByJob:
          type: object
          description: >
            Finished Goods WIP per project: sum of Balance Wt. (Col Q) for rows
            where Type (Col A, new >=Jul-2026 WIP format) = "FG Pending For
            Dispatch". Same unit as balanceWt (kg raw). Absent when the file has
            no Type column (old format) or no FG rows.
          additionalProperties:
            type: number
        fgWipByStructure:
          type: object
          description: >
            Same as fgWipByJob but broken down by structure. Outer key = project;
            inner key = alias/structure (uppercased). Values in kg (same unit as
            balanceWt). Absent when the file has no Type column or no FG rows.
          additionalProperties:
            type: object
            additionalProperties:
              type: number
