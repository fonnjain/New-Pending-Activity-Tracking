openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Login/logout, session status, and password management
  - name: users
    description: User management (admin only)
  - name: imports
    description: Import, merge, and change-log operations
  - name: ai
    description: Optional, advisory-only AI assists (sanitize suggestions and consistency review)
  - name: settings
    description: App-level turnaround-warning configuration (ideal days, grace bands)
  - name: admin
    description: Manual maintenance triggers for otherwise-automatic recompute/backfill passes
  - name: contractorDedup
    description: Contractor name deduplication — AI-assisted merge proposals with human review gate
paths:
  /settings:
    get:
      operationId: getSettings
      tags: [settings]
      summary: Get turnaround settings
      description: >
        Returns the singleton turnaround-warning configuration: a per-activity
        map where each PROCESS_SEQUENCE activity has its own ideal days plus
        yellow/orange/red grace bands. When nothing has been saved yet, returns
        the built-in defaults. Public (read-only).
      responses:
        "200":
          description: Current turnaround settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TurnaroundSettings"
    put:
      operationId: updateSettings
      tags: [settings]
      summary: Update turnaround settings
      description: >
        Upserts the singleton turnaround-warning configuration. Requires
        authentication. Bands are validated and normalized server-side
        (non-negative; yellow <= orange <= red) and the normalized object is
        echoed back.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TurnaroundSettings"
      responses:
        "200":
          description: Saved turnaround settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TurnaroundSettings"
        "400":
          description: Invalid settings payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /rsj-thickness:
    get:
      operationId: listRsjThickness
      tags: [thickness]
      summary: List RSJ thickness lookup entries
      description: >
        Returns the RSJ Types & Thickness lookup table (cleaned "RSJ <dims>"
        group key -> thickness in mm). Used to auto-resolve thickness for NTLT/RSJ
        marks. Public (read-only).
      responses:
        "200":
          description: RSJ thickness entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RsjThickness"
    put:
      operationId: upsertRsjThickness
      tags: [thickness]
      summary: Create or update an RSJ thickness entry
      description: >
        Upserts one RSJ lookup entry keyed by the cleaned "RSJ <dims>" group key.
        Requires authentication. RSJ marks with this group key resolve to the new
        thickness on the next read (live recompute).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RsjThicknessInput"
      responses:
        "200":
          description: Saved entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RsjThickness"
        "400":
          description: Invalid payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteRsjThickness
      tags: [thickness]
      summary: Delete an RSJ thickness entry
      description: >
        Removes one RSJ lookup entry. Requires authentication. The group key is
        passed as a query param (it can contain spaces) to avoid path-segment
        encoding issues.
      parameters:
        - name: groupKey
          in: query
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
  /item-master/upload:
    post:
      operationId: uploadItemMaster
      tags: [thickness]
      summary: Upload item master XLS/XLSX
      description: >
        Parses the VTPL item master spreadsheet (XLS or XLSX, data from row 5
        onward, columns: Select / ItemCode / ItemName / SubGroup / GroupName /
        Category / Grade / SectionWt / ThicknessMM). Upserts all rows into the
        item_master table (keyed on item_code) and clears the thickness cache so
        the new lookup takes effect immediately. Requires authentication.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required: [file]
      responses:
        "200":
          description: Upload summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemMasterUploadResult"
        "400":
          description: Invalid file or no data rows
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /item-master/thickness-rows:
    get:
      operationId: listItemMasterThicknessRows
      tags: [thickness]
      summary: Item master thickness rows grouped by category
      description: >
        Returns all item_master rows that have a thickness value (excluding FG
        JOB WORK), grouped by group_name and sorted alphabetically within each
        group. Used by the Thickness page to display a read-only reference table.
        Public (read-only).
      responses:
        "200":
          description: Grouped thickness rows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ItemMasterThicknessGroup"
  /item-master/stats:
    get:
      operationId: getItemMasterStats
      tags: [thickness]
      summary: Item master statistics
      description: >
        Returns summary statistics for the currently loaded item master: total
        row count, rows with a thickness value (non-JW, non-FG JOB WORK), and
        the timestamp of the most recently upserted row. Used by the admin
        upload card to show whether a master is loaded and when it was last
        updated. Public (read-only).
      responses:
        "200":
          description: Item master statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemMasterStats"
  /manual-thickness:
    get:
      operationId: listManualThickness
      tags: [thickness]
      summary: List manual thickness pins
      description: >
        Returns manual thickness values keyed by mark_id (used for NTLT/GENERAL
        and any hand-pinned mark). These survive re-imports. Public (read-only).
      responses:
        "200":
          description: Manual thickness entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ManualThickness"
    put:
      operationId: upsertManualThickness
      tags: [thickness]
      summary: Create or update a manual thickness pin
      description: >
        Upserts one manual thickness value keyed by mark_id. Requires
        authentication. The mark resolves to this value (source "manual") on the
        next read and the value persists across re-imports.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManualThicknessInput"
      responses:
        "200":
          description: Saved entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManualThickness"
        "400":
          description: Invalid payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteManualThickness
      tags: [thickness]
      summary: Delete a manual thickness pin
      description: >
        Removes one manual thickness pin (the mark reverts to auto/unset).
        Requires authentication. The mark id is passed as a query param (it can
        contain backslashes and spaces) to avoid path-segment encoding issues.
      parameters:
        - name: markId
          in: query
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
  /manual-thickness/apply-item-master:
    post:
      operationId: applyItemMasterThickness
      tags: [thickness]
      summary: Bulk-apply item master thickness to unset marks
      description: >
        For all marks in the given import that are not already manually pinned,
        runs the item-master exact→stripped key lookup and bulk-upserts any
        matches into manual_thickness. Clears the thickness and serialised-records
        caches so the next /records fetch reflects the new pins. Requires auth.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                importId:
                  type: integer
              required: [importId]
      responses:
        "200":
          description: Apply result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplyItemMasterResult"
        "400":
          description: Invalid payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /manual-thickness/import-xlsx:
    post:
      operationId: importThicknessXlsx
      tags: [thickness]
      summary: Bulk-import thickness pins from an Excel file
      description: >
        Accepts a multipart .xlsx/.xls file. Detects a header row containing
        "mark" and "thickness" columns (case-insensitive); falls back to
        col-0=markId, col-1=thickness when no header is found. Bulk-upserts all
        valid rows into manual_thickness and clears the thickness cache.
        Requires auth.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                importId:
                  type: integer
                  description: Optional — when supplied, only that import's records cache is evicted; otherwise all are evicted.
              required: [file]
      responses:
        "200":
          description: Import result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportThicknessXlsxResult"
        "400":
          description: Invalid file or no valid rows
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /fabrication-priorities:
    get:
      operationId: listFabricationPriorities
      tags: [fabricationPriorities]
      summary: List Fabrication-Load priorities
      description: >
        Returns the per-row priorities (P1..P10) for the "Fabrication Load for
        TLT" report, keyed by (section, column, project). Display/planning
        overlay only; never changes parsing, ageing, dedup, qty, the row hash,
        classification, or alert math. Public (read-only).
      responses:
        "200":
          description: Fabrication-Load priority entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FabricationPriority"
    put:
      operationId: upsertFabricationPriority
      tags: [fabricationPriorities]
      summary: Set one Fabrication-Load priority
      description: >
        Upserts one priority keyed by (section, column, project). The report
        reflects it on the next read. Purely a planning overlay.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FabricationPriorityInput"
      responses:
        "200":
          description: Saved entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FabricationPriority"
        "400":
          description: Invalid payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteFabricationPriority
      tags: [fabricationPriorities]
      summary: Clear one Fabrication-Load priority
      description: >
        Removes one priority (the row reverts to unset). The key parts are passed
        as query params because the project string can contain spaces and
        punctuation.
      parameters:
        - name: section
          in: query
          required: true
          schema:
            type: string
        - name: column
          in: query
          required: true
          schema:
            type: string
        - name: project
          in: query
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
  /contractor-aliases:
    get:
      operationId: listContractorAliases
      tags: [contractorDedup]
      summary: List all approved contractor alias mappings
      description: >
        Returns every approved alias row (normalizedAliasKey → canonicalKey + rawName).
        The frontend builds a resolution map from this response so all surfaces
        transparently resolve alias contractor names to their canonical entry.
        Public (read-only).
      responses:
        "200":
          description: Approved alias rows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ContractorAlias"
    delete:
      operationId: deleteContractorAlias
      tags: [contractorDedup]
      summary: Remove a single alias mapping
      description: >
        Removes one alias mapping (undo an approved merge for a single alias).
        The aliasKey is passed as a query param. Requires authentication.
      parameters:
        - name: aliasKey
          in: query
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
  /contractor-dedup/pending-count:
    get:
      operationId: getContractorDedupPendingCount
      tags: [contractorDedup]
      summary: Count of proposals awaiting review
      description: >
        Returns the number of contractor dedup proposals still in 'pending' status.
        Used by the nav badge to show the reviewer there is work to do.
        Public (read-only).
      responses:
        "200":
          description: Pending count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContractorDedupPendingCount"
  /contractor-dedup/proposals:
    get:
      operationId: listContractorDedupProposals
      tags: [contractorDedup]
      summary: List dedup proposals
      description: >
        Returns all contractor dedup proposals, newest first. Optional ?status=
        query param to filter by status (pending, approved, rejected).
        Public (read-only).
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [pending, approved, rejected]
      responses:
        "200":
          description: Proposal list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ContractorDedupProposal"
  /contractor-dedup/analyze:
    post:
      operationId: analyzeContractorDedup
      tags: [contractorDedup]
      summary: Run AI deduplication analysis
      description: >
        Reads all distinct contractor strings from record_pool and
        contractor_categories, calls the AI to propose merge groups, and stores
        the results as pending proposals. Only strings not already covered by
        an alias or an active proposal are sent to the AI. Requires authentication.
      responses:
        "200":
          description: Newly created proposals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContractorDedupAnalyzeResult"
        "503":
          description: AI unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /contractor-dedup/proposals/{id}/approve:
    post:
      operationId: approveContractorDedupProposal
      tags: [contractorDedup]
      summary: Approve a merge proposal
      description: >
        Approves a pending proposal: writes alias rows to contractor_aliases,
        consolidates contractor_categories onto the canonical key, and marks
        the proposal approved. Requires authentication.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Approved
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  id:
                    type: integer
                required: [ok, id]
        "404":
          description: Proposal not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Proposal already reviewed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /contractor-dedup/proposals/{id}/reject:
    post:
      operationId: rejectContractorDedupProposal
      tags: [contractorDedup]
      summary: Reject a merge proposal
      description: >
        Marks a pending proposal as rejected. No alias rows are written.
        The AI will not re-propose the same group unless the covered-keys
        check is reset. Requires authentication.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Rejected
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  id:
                    type: integer
                required: [ok, id]
        "404":
          description: Proposal not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Proposal already reviewed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /contractor-categories:
    get:
      operationId: listContractorCategories
      tags: [contractorCategories]
      summary: List contractor sub-category mappings
      description: >
        Returns the contractor sub-category overlay (normalized name key ->
        category + FAB/GALVA tags). Joined to records at read time; never changes
        parsing, ageing, dedup, qty, or the contractor string. Public (read-only).
      responses:
        "200":
          description: Contractor sub-category entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ContractorCategory"
    put:
      operationId: upsertContractorCategory
      tags: [contractorCategories]
      summary: Create or update a contractor sub-category mapping
      description: >
        Upserts one contractor mapping keyed by the normalized contractor name.
        Requires authentication. Records for this contractor resolve to the new
        category/tags on the next read (live join).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContractorCategoryInput"
      responses:
        "200":
          description: Saved entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContractorCategory"
        "400":
          description: Invalid payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteContractorCategory
      tags: [contractorCategories]
      summary: Delete a contractor sub-category mapping
      description: >
        Removes one contractor mapping (the contractor reverts to Unclassified).
        Requires authentication. The name key is passed as a query param (it can
        contain spaces and punctuation) to avoid path-segment encoding issues.
      parameters:
        - name: nameKey
          in: query
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/me:
    get:
      operationId: getAuthStatus
      tags: [auth]
      summary: Current authentication status
      description: >
        Returns whether the current request carries a valid signed session cookie.
        Used by the frontend to gate the Data view behind login.
      responses:
        "200":
          description: Authentication status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthStatus"
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Log in
      description: >
        Validates the submitted email and password against the users table.
        On success, sets a signed, httpOnly session cookie and returns user info.
        Returns 401 on invalid credentials.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthCredentials"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthStatus"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Login not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/heartbeat:
    post:
      operationId: authHeartbeat
      tags: [auth]
      summary: Record user activity heartbeat
      description: >
        Records that the authenticated user is active right now. Updates the
        current open session's lastActivityAt timestamp. If the open session has
        been idle for more than 5 minutes (now − lastActivityAt > 300 s) the
        server closes it (logoutAt = lastActivityAt, durationSeconds computed)
        and immediately opens a fresh one. Call every ~60 s while the user is
        active. Fire-and-forget — clients may ignore the response.
      responses:
        "200":
          description: Heartbeat recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                required:
                  - ok
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Log out
      description: Clears the session cookie.
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthStatus"
  /auth/change-password:
    post:
      operationId: changePassword
      tags: [auth]
      summary: Change own password
      description: >
        Authenticated users can change their own password. Must provide the
        current password for verification. Clears the mustChangePassword flag.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "200":
          description: Password changed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                required:
                  - success
        "400":
          description: New password too short
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated or wrong current password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List all users
      description: Admin only. Returns all registered users.
      responses:
        "200":
          description: User list
          content:
            application/json:
              schema:
                type: object
                properties:
                  users:
                    type: array
                    items:
                      $ref: "#/components/schemas/AppUser"
                required:
                  - users
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not an admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createUser
      tags: [users]
      summary: Create a user
      description: Admin only. Creates a new user with the default password.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: "#/components/schemas/AppUser"
                required:
                  - user
        "400":
          description: Missing email
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not an admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Email already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /users/{id}/reset-password:
    put:
      operationId: resetUserPassword
      tags: [users]
      summary: Reset a user's password
      description: Admin only. Resets the user's password to the default and sets mustChangePassword.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Password reset
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  email:
                    type: string
                required:
                  - success
                  - email
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not an admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /users/{id}/role:
    put:
      operationId: updateUserRole
      tags: [users]
      summary: Update a user's role
      description: Admin only. Sets the user's role to "admin" or "user".
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetRoleRequest"
      responses:
        "200":
          description: Role updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                required:
                  - success
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not an admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /users/activity:
    get:
      operationId: getUserActivity
      tags: [users]
      summary: Get login activity for all users
      description: Admin only. Returns per-user login sessions grouped by day.
      responses:
        "200":
          description: User activity data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserActivityResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not an admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /users/{id}:
    delete:
      operationId: deleteUser
      tags: [users]
      summary: Delete a user
      description: Admin only. Deletes a user account. Cannot delete your own account.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
