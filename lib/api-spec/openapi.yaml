openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: imports
    description: Import, merge, and change-log operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /imports:
    get:
      operationId: listImports
      tags: [imports]
      summary: List imports
      description: >
        Returns every import in the append-only ledger, newest first, each with its
        parse summary and (when available) a compact change summary versus the prior import.
      responses:
        "200":
          description: List of imports
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Import"
    post:
      operationId: uploadImport
      tags: [imports]
      summary: Upload a report
      description: >
        Upload an .xlsx balance/activity report. The server parses Sheet1 (header on row 3),
        forward-fills Project Code, derives mark identifiers, and preserves in-sheet duplicate
        rows. Every upload is appended as a new import. Distinct full rows are deduplicated only
        ACROSS uploads via a permanent record pool; an import records how many copies of each
        pool row it contains. A field-level change set versus the previous import is computed.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/ImportUpload"
      responses:
        "201":
          description: Import created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadResult"
        "400":
          description: Invalid upload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /imports/compare:
    get:
      operationId: compareImports
      tags: [imports]
      summary: Compare any two imports
      description: Returns the full field-level change set between two arbitrary imports.
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: integer
        - name: to
          in: query
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: The change set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangeSet"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /imports/{id}:
    get:
      operationId: getImport
      tags: [imports]
      summary: Get an import
      description: Returns a single import with its parse and change summaries.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: The import
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Import"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteImport
      tags: [imports]
      summary: Delete an import
      description: >
        Deletes an import and its membership rows. The shared record pool is permanent and
        is never deleted.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /imports/{id}/records:
    get:
      operationId: getImportRecords
      tags: [imports]
      summary: Get records for an import
      description: >
        Returns the records belonging to an import, expanded by copy count so in-sheet
        duplicates appear as separate pending units. Ageing (days) and route progress are
        recomputed live on every read from the assign date versus today.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Records for the import
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Record"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /imports/{id}/changes:
    get:
      operationId: getImportChanges
      tags: [imports]
      summary: Get the change set for an import
      description: >
        Returns the full field-level change set for an import versus the immediately
        preceding import. For the first import, all marks are reported as new.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: The change set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangeSet"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    ImportUpload:
      type: object
      properties:
        file:
          type: string
          format: binary
        label:
          type: string
        reportDate:
          type: string
      required:
        - file
    ParseSummary:
      type: object
      properties:
        rowsRead:
          type: integer
        rowsKept:
          type: integer
        distinctRows:
          type: integer
        duplicateRowCopies:
          type: integer
        projectsFound:
          type: integer
        missingContractor:
          type: integer
        missingDate:
          type: integer
      required:
        - rowsRead
        - rowsKept
        - distinctRows
        - duplicateRowCopies
        - projectsFound
        - missingContractor
        - missingDate
    ChangeSummary:
      type: object
      properties:
        prevImportId:
          type: ["integer", "null"]
        addedRows:
          type: integer
        unchangedRows:
          type: integer
        movedActivity:
          type: integer
        qtyChanged:
          type: integer
        newMarks:
          type: integer
        completed:
          type: integer
        netPendingQtyChange:
          type: number
        netPendingWtChange:
          type: number
        flags:
          type: array
          items:
            type: string
      required:
        - prevImportId
        - addedRows
        - unchangedRows
        - movedActivity
        - qtyChanged
        - newMarks
        - completed
        - netPendingQtyChange
        - netPendingWtChange
        - flags
    Import:
      type: object
      properties:
        id:
          type: integer
        label:
          type: ["string", "null"]
        sourceFilename:
          type: string
        reportDate:
          type: ["string", "null"]
        createdAt:
          type: string
        summary:
          $ref: "#/components/schemas/ParseSummary"
        changeSummary:
          oneOf:
            - $ref: "#/components/schemas/ChangeSummary"
            - type: "null"
      required:
        - id
        - label
        - sourceFilename
        - reportDate
        - createdAt
        - summary
        - changeSummary
    ChangeItem:
      type: object
      properties:
        markId:
          type: string
        job:
          type: string
        structure:
          type: string
        markTail:
          type: string
        contractor:
          type: ["string", "null"]
        activityFrom:
          type: ["string", "null"]
        activityTo:
          type: ["string", "null"]
        qtyFrom:
          type: ["number", "null"]
        qtyTo:
          type: ["number", "null"]
        wtFrom:
          type: ["number", "null"]
        wtTo:
          type: ["number", "null"]
      required:
        - markId
        - job
        - structure
        - markTail
        - contractor
        - activityFrom
        - activityTo
        - qtyFrom
        - qtyTo
        - wtFrom
        - wtTo
    ChangeCounts:
      type: object
      properties:
        addedRows:
          type: integer
        unchangedRows:
          type: integer
        movedActivity:
          type: integer
        qtyChanged:
          type: integer
        newMarks:
          type: integer
        completed:
          type: integer
      required:
        - addedRows
        - unchangedRows
        - movedActivity
        - qtyChanged
        - newMarks
        - completed
    ChangeSet:
      type: object
      properties:
        fromImportId:
          type: ["integer", "null"]
        toImportId:
          type: integer
        fromLabel:
          type: ["string", "null"]
        toLabel:
          type: ["string", "null"]
        counts:
          $ref: "#/components/schemas/ChangeCounts"
        netPendingQtyChange:
          type: number
        netPendingWtChange:
          type: number
        movedActivity:
          type: array
          items:
            $ref: "#/components/schemas/ChangeItem"
        qtyChanged:
          type: array
          items:
            $ref: "#/components/schemas/ChangeItem"
        newMarks:
          type: array
          items:
            $ref: "#/components/schemas/ChangeItem"
        completed:
          type: array
          items:
            $ref: "#/components/schemas/ChangeItem"
        flags:
          type: array
          items:
            type: string
      required:
        - fromImportId
        - toImportId
        - fromLabel
        - toLabel
        - counts
        - netPendingQtyChange
        - netPendingWtChange
        - movedActivity
        - qtyChanged
        - newMarks
        - completed
        - flags
    UploadResult:
      type: object
      properties:
        import:
          $ref: "#/components/schemas/Import"
        changeSet:
          $ref: "#/components/schemas/ChangeSet"
      required:
        - import
        - changeSet
    Record:
      type: object
      properties:
        id:
          type: integer
        importId:
          type: integer
        markId:
          type: string
        job:
          type: string
        structure:
          type: string
        markTail:
          type: string
        markNo:
          type: string
        alias:
          type: ["string", "null"]
        section:
          type: ["string", "null"]
        jobCardNo:
          type: ["string", "null"]
        towerType:
          type: ["string", "null"]
        towerSubType:
          type: ["string", "null"]
        length:
          type: ["number", "null"]
        width:
          type: ["number", "null"]
        wtPcs:
          type: ["number", "null"]
        balanceQty:
          type: number
        balanceWt:
          type: number
        activity:
          type: ["string", "null"]
        operation:
          type: ["string", "null"]
        assignDate:
          type: ["string", "null"]
        contractor:
          type: ["string", "null"]
        orderNature:
          type: ["string", "null"]
        refJobCardNo:
          type: ["string", "null"]
        ageingDays:
          type: ["integer", "null"]
        routeSteps:
          type: array
          items:
            type: string
        currentStepIndex:
          type: ["integer", "null"]
      required:
        - id
        - importId
        - markId
        - job
        - structure
        - markTail
        - markNo
        - alias
        - section
        - jobCardNo
        - towerType
        - towerSubType
        - length
        - width
        - wtPcs
        - balanceQty
        - balanceWt
        - activity
        - operation
        - assignDate
        - contractor
        - orderNature
        - refJobCardNo
        - ageingDays
        - routeSteps
        - currentStepIndex
