          description: User deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                required:
                  - success
        "400":
          description: Cannot delete own account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not an admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /imports:
    get:
      operationId: listImports
      tags: [imports]
      summary: List imports
      description: >
        Returns imports in the append-only ledger, newest first, each with its
        parse summary and (when available) a compact change summary versus the prior import.
        By default the list is scoped to the global "valid data starts here" cutoff
        (settings.validFromDate) — imports dated before the cutoff are excluded so the
        whole app agrees on the active window. Pass `all=true` to bypass the cutoff and
        return every import (used by the admin cutoff picker).
      parameters:
        - name: all
          in: query
          required: false
          schema:
            type: boolean
          description: >
            When true, ignore the global WIP cutoff and return every import
            regardless of date. Default false (scoped to the cutoff).
      responses:
        "200":
          description: List of imports
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Import"
    post:
      operationId: uploadImport
      tags: [imports]
      summary: Upload a report
      description: >
        Upload an .xlsx balance/activity report. The server parses Sheet1 (header on row 3),
        forward-fills Project Code, derives mark identifiers, and preserves in-sheet duplicate
        rows. Every upload is appended as a new import. Distinct full rows are deduplicated only
        ACROSS uploads via a permanent record pool; an import records how many copies of each
        pool row it contains. A field-level change set versus the previous import is computed.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/ImportUpload"
      responses:
        "201":
          description: Import created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadResult"
        "400":
          description: Invalid upload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteAllImports
      tags: [imports]
      summary: Delete all data
      description: >
        Permanently deletes ALL imports, their membership rows, and the shared record pool.
        This is a full reset of the dataset and cannot be undone. After this, the app is empty
        and new reports can be uploaded fresh.
      responses:
        "200":
          description: Deletion summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteAllResult"
  /imports/stage:
    post:
      operationId: stageImport
      tags: [imports]
      summary: Stage a raw upload for validation
      description: >
        Accepts ANY uploaded file and holds its raw bytes in a short-lived staging area
        WITHOUT writing to the record pool or imports ledger. Performs a best-effort
        structural read (header detection, columns found vs expected, row count, problems)
        and returns a stagingId used by validate and commit. Nothing is committed here.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/ImportUpload"
      responses:
        "201":
          description: File staged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StageResult"
        "400":
          description: Invalid upload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /imports/validate:
    post:
      operationId: validateStagedImport
      tags: [imports]
      summary: Validate a staged upload with the AI gatekeeper
      description: >
        Sends a compact, descriptive-only sample of the staged file to Claude, which acts as a
        gatekeeper: it returns a verdict (ok | reject) and, when ok, optional descriptive
        sanitize suggestions (never identity/quantity/engine fields). Read-only and advisory:
        it never writes data. When ANTHROPIC_API_KEY is unset, returns available:false so the
        UI can offer "Skip check & import as-is".
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ValidateRequest"
      responses:
        "200":
          description: Validation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationResult"
        "404":
          description: Staged upload not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /imports/commit:
    post:
      operationId: commitStagedImport
      tags: [imports]
      summary: Commit a staged upload
      description: >
        Applies any user-accepted descriptive suggestions to the staged data, then runs the
        SAME deterministic parse + append-only merge as a direct upload, creating a new import.
        The staged row is deleted afterwards. Accepted suggestions only touch descriptive fields
        and never change row identity, quantities, or any computed/engine field.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommitRequest"
      responses:
        "200":
          description: Idempotent commit replay (WIP or Order Review)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommitResult"
        "201":
          description: Import created (WIP or Order Review)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommitResult"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Staged upload not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /imports/deletion-log:
    get:
      operationId: listDeletionLog
      tags: [imports]
      summary: List import deletion log
      description: >
        Returns all deletion audit log entries (WIP and Order Review),
        newest first. Each entry records who deleted which file and when.
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Deletion log entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ImportDeletionLogEntry"
  /imports/stage/{id}:
    delete:
      operationId: discardStagedImport
      tags: [imports]
      summary: Discard a staged upload
      description: Removes a staged upload without committing it. Idempotent.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Staged upload discarded
  /imports/compare:
    get:
      operationId: compareImports
      tags: [imports]
      summary: Compare any two imports
      description: Returns the full field-level change set between two arbitrary imports.
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: integer
        - name: to
          in: query
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: The change set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangeSet"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /imports/{id}:
    get:
      operationId: getImport
      tags: [imports]
      summary: Get an import
      description: Returns a single import with its parse and change summaries.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: The import
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Import"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteImport
      tags: [imports]
      summary: Delete an import
      description: >
        Deletes an import and its membership rows. The shared record pool is permanent and
        is never deleted.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /imports/{id}/records:
    get:
      operationId: getImportRecords
      tags: [imports]
      summary: Get records for an import
      description: >
        Returns the records belonging to an import, expanded by copy count so in-sheet
        duplicates appear as separate pending units. Ageing (days) and route progress are
        recomputed live on every read from the assign date versus today.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Records for the import
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Record"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /imports/{id}/summary:
    post:
      operationId: getImportSummary
      tags: [imports]
      summary: Get a server-computed Overview summary for a filtered import
      description: >
        Computes the Overview page's headline metrics SERVER-SIDE from the
        import's records with the supplied filter set and (optional) resolved
        date window applied, so the client never has to download the full ~40 MB
        records payload just to render the dashboard. The filtering and
        aggregation run the exact same shared code the client uses, so the
        numbers are identical by construction. Purely additive and read-only —
        never changes parsing, activity values, qty, dedup, or ageing math. The
        date window is passed as resolved epoch-ms bounds (computed from the
        client's local "today") so date classification matches the client
        regardless of server timezone.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SummaryRequest"
      responses:
        "200":
          description: Server-computed Overview summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportSummary"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /imports/{id}/movement:
    get:
      operationId: getImportMovement
      tags: [imports]
      summary: Get per-mark days-since-last-movement for an import
      description: >
        For each mark identity in the given import, returns how many days it has
        been since its activity / last-production signature last changed, computed
        by walking the preceding imports. Used (with the live stalledDays setting)
        to flag stalled marks. daysSinceLastMovement is null when there is no prior
        history for that mark (first appearance / no earlier import), so stalled
        detection degrades gracefully until snapshots accumulate.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Per-identity movement info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MovementResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /imports/{id}/velocity:
    get:
      operationId: getImportVelocity
      tags: [imports]
      summary: Get per-mark velocity (pace / ETA / trend) for an import
      description: >
        For each mark identity in the given import, walks the preceding imports to
        build a snapshot series (import date + activity stage + last production
        date) and computes a deterministic VELOCITY: observed pace (days per
        advanced stage), a pace-based ETA, the gap vs the budget target, a trend,
        and a movement status (moving / slow / stalled / insufficient). Purely
        additive and advisory — it never changes parsing, activity values, dedup,
        ageing, or the alert/threshold/lifecycle math. Rolled-up project /
        contractor / stage aggregates are included. Velocity is null per-field when
        there is not enough history (cold start), so it degrades gracefully.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Per-identity velocity info with aggregates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VelocityResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /imports/{id}/production-movement:
    get:
      operationId: getImportProductionMovement
      tags: [imports]
      summary: Cutting output (mark-level) + net balance delta for consecutive imports
      description: >
        Walks backwards from the given import (up to 7 predecessors) and, for
        each consecutive pair, computes: (1) TLT Cutting output — mark-level
        balance drawdown between snapshots (marks that left C + marks still at C
        whose weight decreased); (2) net balance delta per activity (current
        minus previous import balance weight in MT). FG delta is derived from
        parseSummary.fgWipByJob. Only consecutive pairs are compared — gaps
        (elapsed days > 1) are flagged but still returned. Purely additive and
        advisory — never changes parsing, activity, dedup, ageing, or any
        warning/milestone/dispatch state.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Cutting output + net balance delta for consecutive import pairs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductionMovementResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /imports/{id}/contractor-movement:
    get:
      operationId: getImportContractorMovement
      tags: [imports]
      summary: Per-contractor balance movement for consecutive imports (mark-level)
      description: >
        Walks backwards from the given import (up to 7 predecessors) and, for
        each consecutive pair, computes five mark-level measures per contractor
        (TLT / orderNature = "Structure" only, no project code forward-fill):
        Produced (weight actually drawn down — same-contractor reductions + marks
        that fully left WIP); Received (weight reassigned in from another
        contractor); Released (weight reassigned out to another contractor);
        New Intake (new marks attributed to this contractor); Net Change
        (overall balance delta). Purely additive and advisory — never changes
        parsing, activity, dedup, ageing, or any warning/milestone/dispatch state.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Per-contractor movement for consecutive import pairs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContractorBalanceMovementResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /milestones:
    get:
      operationId: getMilestones
      tags: [imports]
      summary: Get permanent per-project turnaround milestones (Ready / Dispatched)
      description: >
        Deterministically recomputes, from the full append-only import history,
        two PERMANENT per-project turnaround milestones measured from the
        project's earliest Assign Date: MILESTONE 1 "Ready for Dispatch" (the
        first import where no mark remains in an earlier activity C..GB — every
        mark is at Y or gone) and MILESTONE 2 "Dispatched" (the first import where
        the project is entirely absent). Captured dates are preserved
        (capture-once) and persisted, so they survive after a project leaves the
        report. Includes planned (cumulative Y target) vs actual variance.
        Project-less rows ("(Unassigned)") are excluded. Purely additive — never
        changes parsing, activity values, dedup, ageing, warning, or velocity.
      responses:
        "200":
          description: Per-project turnaround milestones
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MilestonesResponse"
  /contractor-movement:
    get:
      operationId: getContractorMovement
      tags: [imports]
      summary: Get the Contractor Performance daily activity-movement ledger
      description: >
        Deterministically recomputes, from the full append-only import
        history (no cutoff), a daily log of how much work (mark count +
        weight) moved from one activity to the next. Credit for a move is
        attributed to the contractor of the FROM activity — the one who
        completed and released that stage. One entry per (date, project,
        contractor, fromActivity, toActivity), already aggregated. Purely
        additive — never changes parsing, activity values, dedup, ageing,
        warning, milestone, or dispatch state.
      responses:
        "200":
          description: Contractor movement ledger entries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContractorMovementResponse"
  /release-balance:
    get:
      operationId: getReleaseBalance
      tags: [imports]
      summary: Get per-structure Release Balance Computed, optionally scoped to a specific import
      description: >
        Returns the Release Balance Computed (MT) — the sum of Balance Wt.
        (Col Q) ÷ 1000 for rows where Type (Col A) = "Job Card Not Started"
        AND Job Card Status (Col G) = "Initial" — grouped by (project,
        structure) for the specified import (or the most recently committed WIP
        import when importId is omitted), joined to the Order Review file's own
        stated Release Balance (fileBalReleaseMt) for cross-checking. Purely
        additive — never changes parsing, activity values, dedup, ageing,
        warning, milestone, or dispatch state.
      parameters:
        - in: query
          name: importId
          schema:
            type: integer
          required: false
          description: >
            WIP import to scope the Release Balance figures to. When omitted,
            falls back to the most recently committed WIP import.
      responses:
        "200":
          description: Release Balance Computed rows and totals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReleaseBalanceResponse"
  /reports/fabrication-project-completion-tlt:
    get:
      operationId: getFabricationProjectCompletionTlt
      tags: [imports]
      summary: Fabrication Report – Project Completion (TLT only)
      description: >
        Returns a per-(project, BOM Label) breakdown of four completion measures
        for TLT marks only: Release Balance Calculated (Job Card Not Started +
        Initial rows), Assignment Balance Calculated (Job Card Not Started + blank
        contractor), Cutting Balance (activity C), and Quality Check Balance
        (activities RFI, NH, B, HAB, W, Q, TS). All weights in MT. BOM Label is
        derived from the Order Review file (Proto / Mass / Pre); structures with
        multiple BOM labels → "Mixed"; no match → "Unknown". Grand totals
        included. Purely additive read — never changes parsing, hashing, dedup,
        ageing, activity, qty, or any other state.
      responses:
        "200":
          description: Fabrication project completion rows and totals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FabricationProjectCompletionResponse"
  /admin/recompute:
    post:
      operationId: adminRecompute
      tags: [admin]
      summary: Manually trigger every deterministic recompute/backfill pass
      description: >
        Re-runs, on demand, every deterministic recompute and backfill pass the
        app otherwise runs automatically (best-effort after upload/delete/
        settings changes, or once at boot): classification backfill, hole-
        operation backfill, milestones, accumulated WIP, contractor movement,
        and dispatch. Every pass is a pure re-derivation from permanent
        append-only history or raw stored columns — nothing here is
        authoritative or destructive, so running it repeatedly is always safe
        and idempotent. Exists purely as a manual fallback (e.g. a prior
        automatic pass failed silently, or the server restarted mid-backfill);
        normal operation never requires it. Requires auth.
      responses:
        "200":
          description: Recompute summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminRecomputeResult"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /order-status:
    get:
      operationId: getOrderStatus
      tags: [orderStatus]
      summary: Get the latest Order Review rows joined to computed dispatch
      description: >
        Returns the latest "Order Review" file ingest (the second input file) as
        per-(project, structure) rows, joined to the computed running Dispatch
        tonnage (seed baseline + Yard-departure accruals), plus a file-vs-computed
        dispatch reconciliation at a 1% tolerance. Fabrication / Galvanizing / Yard
        tonnages are computed client-side from the selected WIP import's records
        (ACTIVITY_BUNDLES) so header filters are honoured. Purely additive and
        read-only — never changes WIP parsing, activity, dedup, ageing, warning,
        velocity, or milestone state. available:false when no Order Review file has
        been ingested yet.
      responses:
        "200":
          description: Order status overlay
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderStatusResponse"
  /order-imports/{id}:
    delete:
      operationId: deleteOrderImport
      tags: [orderStatus]
      summary: Delete one Order Review file from the upload history
      description: >
        Removes a single Order Review upload from the history log. The Order Review
        file is a daily snapshot merged (UPSERTed) into one current order book, so
        deleting a history entry does NOT roll back the current order-book values.
        Deleting the most recent upload re-points the current snapshot rows to the
        now-latest remaining upload. Deleting the last remaining upload clears the
        entire order book (rows + computed dispatch). Purely additive to WIP state —
        never touches WIP parsing, activity, dedup, ageing, warning, or milestone math.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /inventory/buckets:
    get:
      operationId: getInventoryBuckets
      tags: [inventory]
      summary: Get the raw rows behind the Inventory page's auto buckets (B/C/D)
      description: >
        Returns one row per (project, structure) from the latest Order Review
        snapshot, each carrying the two driving numbers (fileBalReleaseMt =
        Balance->Release Col S, inspectionMt = Progress->Inspection Col O) plus
        the distinct contractor names touching that structure in the newest WIP
        import. Server work is kept to this join only — the B/C/D numeric
        filters, null-exclusion flagging, and in-house/out-vendor side
        classification (contractor_categories + hardcoded name overrides) are
        computed client-side so the page's own filters stay in sync with the
        rest of the app. Purely additive and read-only; available:false when no
        Order Review file has been ingested yet.
      responses:
        "200":
          description: Raw joined rows for the Inventory page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryBucketsResponse"
  /inventory-manual/e:
    get:
      operationId: listInventoryManualE
      tags: [inventory]
      summary: List manual Bucket E ("Material Ready But Not Dispatched") entries
      description: >
        Returns the persisted Bucket E list (dropdown-picked project entries the
        user maintains directly on the Inventory page). Survives re-uploads of
        both WIP and Order Review files. Public (read-only).
      responses:
        "200":
          description: Bucket E entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InventoryManualEntry"
    put:
      operationId: upsertInventoryManualE
      tags: [inventory]
      summary: Add or update a manual Bucket E entry
      description: >
        Inserts a new Bucket E entry, or updates one in place when `id` is
        supplied. Requires authentication.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InventoryManualEntryInput"
      responses:
        "200":
          description: Saved entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryManualEntry"
        "400":
          description: Invalid payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Entry not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteInventoryManualE
      tags: [inventory]
      summary: Remove a manual Bucket E entry
      description: >
        Removes one Bucket E entry by id. Requires authentication.
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
  /inventory-manual/mfc-batch-colors:
    get:
      operationId: listInventoryMfcBatchColors
      tags: [inventory]
      summary: List MFC batch colour assignments (per project + batch pair)
      description: >
        Returns all stored (project, MFC batch) → colour mappings, along with
        optional milestone dates. Applied as Excel cell background fills when
        the inventory bucket list is exported. Public (read-only).
      responses:
        "200":
          description: MFC batch colour entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InventoryMfcBatchColor"
    put:
      operationId: upsertInventoryMfcBatchColor
      tags: [inventory]
      summary: Set or replace the colour for a (project, MFC batch) pair
      description: >
        Inserts or updates the colour and optional milestone dates for a
        (project, MFC batch) pair. Requires authentication.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InventoryMfcBatchColorInput"
      responses:
        "200":
          description: Saved entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryMfcBatchColor"
        "400":
          description: Invalid payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteInventoryMfcBatchColor
      tags: [inventory]
      summary: Remove the colour assignment for a (project, MFC batch) pair
      description: >
        Removes the stored colour entry for the given project + MFC batch.
        Requires authentication.
      parameters:
        - name: project
          in: query
          required: true
          schema:
            type: string
        - name: mfcBatch
          in: query
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
  /inventory-manual/side-overrides:
    get:
      operationId: listInventorySideOverrides
      tags: [inventory]
      summary: List permanent side overrides for auto-computed Buckets B/C/D
      description: >
        Returns the full list of stored side overrides (In-House / Out-Vendor)
        for projects in auto-computed Buckets B, C, and D. Overrides are
        applied client-side on every render so the project always appears on
        the correct side regardless of the contractor classification in the
        latest WIP file. Public (read-only).
      responses:
        "200":
          description: Side override entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InventorySideOverride"
    put:
      operationId: upsertInventorySideOverride
      tags: [inventory]
      summary: Create or replace a side override for a project in a given bucket
      description: >
        Inserts a new (projectCode, bucket) override or replaces the existing
        one (upsert). Requires authentication.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InventorySideOverrideInput"
      responses:
        "200":
          description: Saved override
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventorySideOverride"
        "400":
          description: Invalid payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteInventorySideOverride
      tags: [inventory]
      summary: Remove a side override for a project in a given bucket
      description: >
        Removes the stored side override for a (projectCode, bucket) pair.
        After deletion the project falls back to its auto-computed side.
        Requires authentication.
      parameters:
        - name: projectCode
          in: query
          required: true
          schema:
            type: string
        - name: bucket
          in: query
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
  /current-jobs/upload:
    post:
      operationId: uploadCurrentJobs
      tags: [currentJobs]
      summary: Upload a "Current Jobs" list (project codes only)
      description: >
        Parses the first column of the first sheet as a plain list of project
        codes, normalizes them with the same rules used for WIP/Order Review
        project codes, and REPLACES the current list in full (not append).
        Matched/unmatched are computed against the latest WIP import UNION the
        latest Order Review import, for display only -- unmatched codes are
        still stored and still usable by the filter. Requires authentication.
        Purely additive: never touches WIP/Order Review parsing, hash/dedup
        identity, Activity, qty, or ageing.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/CurrentJobsUpload"
      responses:
        "200":
          description: Replaced Current Jobs list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentJobsUploadResponse"
        "400":
          description: Invalid or empty file
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /current-jobs:
    get:
      operationId: getCurrentJobs
      tags: [currentJobs]
      summary: Get the current "Current Jobs" list
      description: >
        Returns the persisted list of project codes (empty array if none
        uploaded or after a clear) plus provenance for the most recent upload.
        Public (read-only) -- drives the "Current Jobs" Job filter option.
      responses:
        "200":
          description: Current Jobs list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentJobsState"
    delete:
      operationId: clearCurrentJobs
      tags: [currentJobs]
      summary: Clear the Current Jobs list
      description: >
        Empties the current list (upload history/provenance is untouched).
        Requires authentication.
      responses:
        "204":
          description: Cleared
  /imports/{id}/changes:
    get:
      operationId: getImportChanges
      tags: [imports]
      summary: Get the change set for an import
      description: >
        Returns the full field-level change set for an import versus the immediately
        preceding import. For the first import, all marks are reported as new.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: The change set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangeSet"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /ai/status:
    get:
      operationId: aiStatus
      tags: [ai]
      summary: Whether the AI layer is configured (advisory)
      description: >
        Optional, advisory-only. Reports whether an Anthropic API key is configured server-side so the
        UI can enable or disable AI assists up front. Returns available:false when ANTHROPIC_API_KEY is
        unset; the deterministic engine is unaffected either way. The key itself is never returned.
      responses:
        "200":
          description: AI availability
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiStatus"
  /ai/sanitize:
    post:
      operationId: aiSanitize
      tags: [ai]
      summary: Suggest descriptive-field cleanups for an import (advisory)
      description: >
        Optional, advisory-only. Asks the model to SUGGEST cleanups for descriptive fields only
        (malformed dates -> YYYY-MM-DD, inconsistent contractor/section spellings canonicalized to
        the most common form, trimmed whitespace, obvious typos). It never touches balanceQty,
        balanceWt, activity, operation, markId, or any hashed identity input, and it never applies
        changes - only returns a diff list. If ANTHROPIC_API_KEY is unset the endpoint responds with
        available:false and an empty suggestion list; the deterministic engine is unaffected.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SanitizeRequest"
      responses:
        "200":
          description: Sanitize suggestions (or available:false when AI is disabled)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SanitizeResult"
        "404":
          description: Import not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /ai/review:
    post:
      operationId: aiReview
      tags: [ai]
      summary: AI consistency review of an import's results (advisory, read-only)
      description: >
        Optional, advisory-only and read-only. Sends the parsed-records summary and the deterministic
        change set (versus the previous import, or versus compareTo when given) and asks the model to
        AUDIT consistency (ageing math, unknown activity codes, activity not in its operation route,
        null contractor/date, backward route moves, qty increases, mass contractor reassignment, a
        flood of completed marks). Returns a verdict, summary, stats, and findings. When the standard
        verdict is not "pass" or deep is requested, a deeper model pass adds a prioritized plan. The
        AI never writes to record_pool, import_rows, or any computed field. If ANTHROPIC_API_KEY is
        unset the endpoint responds with available:false; the deterministic engine is unaffected.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewRequest"
      responses:
        "200":
          description: Review result (or available:false when AI is disabled)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewResult"
        "404":
          description: Import not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /ai/report:
    post:
      operationId: aiReport
      tags: [ai]
      summary: Deep turnaround-time analytical report for an import (advisory, read-only)
      description: >
        Optional, advisory-only and read-only. The server pre-computes a compact, deterministic
        analytics pack from the selected import's records (ageing = today - lastProductionDate): totals,
        ageing buckets, by-activity / by-contractor / by-job / by-structure aggregates, WIP
        concentration, top stale items, data-quality notes, and change-set deltas versus the previous
        import (or compareTo). That pack - never the raw rows - is sent to the model, which acts as a
        fabrication-operations analyst and returns a structured turnaround report (summary, action
        plan, detailed analysis). Optional filters restrict the analysis to a slice. The AI never
        writes to record_pool, import_rows, or any computed field. If ANTHROPIC_API_KEY is unset the
        endpoint responds with available:false; the deterministic engine is unaffected.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportRequest"
      responses:
        "200":
          description: Turnaround report (or available:false when AI is disabled)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportResult"
        "404":
          description: Import not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    AuthCredentials:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
      required:
        - email
        - password
    AuthStatus:
      type: object
      properties:
        authenticated:
          type: boolean
        email:
          type: string
        displayName:
          type: ["string", "null"]
        role:
          type: string
        mustChangePassword:
          type: boolean
      required:
        - authenticated
    ChangePasswordRequest:
      type: object
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
      required:
        - currentPassword
        - newPassword
    AppUser:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        displayName:
          type: ["string", "null"]
        role:
          type: string
        mustChangePassword:
          type: boolean
        createdAt:
          type: string
      required:
        - id
        - email
        - role
        - mustChangePassword
        - createdAt
    CreateUserRequest:
      type: object
      properties:
        email:
          type: string
        displayName:
          type: string
        role:
          type: string
          enum: [admin, user]
      required:
        - email
    UserSessionEntry:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        email:
          type: string
        displayName:
          type: ["string", "null"]
        loginAt:
          type: string
        lastActivityAt:
          type: ["string", "null"]
          description: ISO-8601. Last heartbeat received; null for legacy rows. Used to determine idle vs active.
        logoutAt:
          type: ["string", "null"]
        durationSeconds:
          type: ["integer", "null"]
      required:
        - id
        - userId
        - email
        - loginAt
    UserActivityDay:
      type: object
      properties:
        date:
          type: string
          description: YYYY-MM-DD
        sessions:
          type: array
          items:
            $ref: "#/components/schemas/UserSessionEntry"
      required:
        - date
        - sessions
    UserActivityResponse:
      type: object
      properties:
        days:
          type: array
          items:
            $ref: "#/components/schemas/UserActivityDay"
        totalSessions:
          type: integer
      required:
        - days
        - totalSessions
    WipColumnRename:
      type: object
      properties:
        position:
          type: integer
          description: 1-based column position
        expected:
          type: string
        found:
          type: string
      required: [position, expected, found]
    WipColumnReorder:
      type: object
      properties:
        name:
          type: string
        expectedPosition:
          type: integer
        foundPosition:
          type: integer
      required: [name, expectedPosition, foundPosition]
    WipFormatCheck:
      type: object
      description: Result of classifying uploaded WIP file headers into three tiers (critical / known-optional / unknown).
      properties:
        ok:
          type: boolean
          description: True when every column is recognised and no critical column is missing.
        expectedCount:
          type: integer
        foundCount:
          type: integer
        missingExpected:
          type: array
          items:
            type: string
          description: Missing REQUIRED (critical) columns only — always equals criticalMissing.
        unexpectedFound:
          type: array
          items:
            type: string
          description: Columns recognised by neither the critical nor the known list.
        optionalAbsent:
          type: array
          items:
            type: string
          description: Known-optional columns absent from this file. Informational, never a warning.
        renames:
          type: array
          items:
            $ref: "#/components/schemas/WipColumnRename"
          description: Positions where the header text changed and neither name appears elsewhere.
        reorders:
          type: array
          items:
            $ref: "#/components/schemas/WipColumnReorder"
          description: Expected columns that are present but at a different position.
        criticalMissing:
          type: array
          items:
            type: string
          description: Subset of missingExpected that are critical to core features.
        isOldFormat:
          type: boolean
          description: File appears to be the older 21-column Project-Code-first layout.
        impactNote:
          type: ["string", "null"]
          description: Human-readable description of downstream impact.
      required:
        - ok
        - expectedCount
        - foundCount
        - missingExpected
        - unexpectedFound
        - optionalAbsent
        - renames
        - reorders
        - criticalMissing
        - isOldFormat
        - impactNote
    SetRoleRequest:
      type: object
      properties:
        role:
          type: string
          enum: [admin, user]
      required:
        - role
    ImportUpload:
      type: object
      properties:
        file:
          type: string
          format: binary
        label:
          type: string
        reportDate:
          type: string
      required:
        - file
    ParseSummary:
      type: object
      properties:
        rowsRead:
          type: integer
        rowsKept:
          type: integer
        distinctRows:
          type: integer
        duplicateRowCopies:
          type: integer
        projectsFound:
          type: integer
        missingContractor:
          type: integer
        missingDate:
          type: integer
        notStarted:
          type: integer
          description: Blank Last Production Entry Date AND activity == C (production not begun).
        noProductionDate:
          type: integer
          description: Blank Last Production Entry Date AND activity != C (progressed past cutting; data-quality flag).
        futureProductionDate:
          type: integer
          description: Last Production Entry Date later than today (clamped to today for ageing).
        ntltOrphanCount:
          type: integer
          description: >
            NTLT marks (RSJ POLE / EARTHING / GENERAL) with no project code,
            attributed to "(Unassigned)" grouped by Section. Absent when zero
            such rows exist.
        ntltOrphanWtMt:
          type: number
          description: >
            Total Balance Wt. (MT) of the NTLT orphan marks (same rows as
            ntltOrphanCount). Absent when ntltOrphanCount is absent.
        unclassifiedRowCount:
          type: integer
          description: >
            Rows whose Col A ("Type") or Col G ("Job Card Status") did not match
            the verified closed value sets. Non-zero means a new file format value
            was encountered. Absent (or zero) in the normal case.
        unclassifiedWtKg:
          type: number
          description: >
            Total Balance Wt. (kg) of unclassified rows — same population as
            unclassifiedRowCount. Absent when unclassifiedRowCount is absent or zero.
        unclassifiedSamples:
          type: array
          description: >
            Up to 5 distinct Type+Status combos from unclassified rows, for
            diagnosis. Absent when unclassifiedRowCount is absent or zero.
          items:
            type: object
            properties:
              type:
                type: string
              status:
                type: string
            required:
              - type
              - status
        fgWipByJob:
          type: object
          description: >
            Finished Goods WIP per project: sum of Balance Wt. (Col Q) for rows
            where Type (Col A, new >=Jul-2026 WIP format) = "FG Pending For
            Dispatch". Same unit as balanceWt (kg raw). Absent when the file has
            no Type column (old format) or no FG rows.
          additionalProperties:
            type: number
        fgWipByStructure:
          type: object
          description: >
            Same as fgWipByJob but broken down by structure. Outer key = project;
            inner key = alias/structure (uppercased). Values in kg (same unit as
            balanceWt). Absent when the file has no Type column or no FG rows.
          additionalProperties:
            type: object
            additionalProperties:
              type: number
      required:
        - rowsRead
        - rowsKept
        - distinctRows
        - duplicateRowCopies
        - projectsFound
        - missingContractor
        - missingDate
        - notStarted
        - noProductionDate
        - futureProductionDate
    ChangeSummary:
      type: object
      properties:
        prevImportId:
          type: ["integer", "null"]
        addedRows:
          type: integer
        unchangedRows:
          type: integer
        movedActivity:
          type: integer
        qtyChanged:
          type: integer
        newMarks:
          type: integer
        completed:
          type: integer
        netPendingQtyChange:
          type: number
        netPendingWtChange:
          type: number
        flags:
          type: array
          items:
            type: string
      required:
        - prevImportId
        - addedRows
        - unchangedRows
        - movedActivity
        - qtyChanged
        - newMarks
        - completed
        - netPendingQtyChange
        - netPendingWtChange
        - flags
    Import:
      type: object
      properties:
        id:
          type: integer
        label:
          type: ["string", "null"]
        sourceFilename:
          type: string
        reportDate:
          type: ["string", "null"]
        asOnDate:
          type: ["string", "null"]
        createdAt:
          type: string
        summary:
          $ref: "#/components/schemas/ParseSummary"
        changeSummary:
          oneOf:
            - $ref: "#/components/schemas/ChangeSummary"
            - type: "null"
        hasTypeData:
          type: boolean
          description: >
            True when this import has per-row job_card_type / job_card_status data
            stored in import_rows (i.e. it was ingested with the current code that
            writes those columns). False for imports uploaded before that code
            existed — their classification is fabricated via COALESCE from the pool
            and must never be shown as bucket figures.
      required:
        - id
        - label
        - sourceFilename
        - reportDate
        - asOnDate
        - createdAt
        - summary
        - changeSummary
        - hasTypeData
    ChangeItem:
      type: object
      properties:
        markId:
          type: string
        job:
          type: string
        structure:
          type: string
        markTail:
          type: string
        contractor:
          type: ["string", "null"]
        activityFrom:
          type: ["string", "null"]
        activityTo:
          type: ["string", "null"]
        qtyFrom:
          type: ["number", "null"]
        qtyTo:
          type: ["number", "null"]
        wtFrom:
          type: ["number", "null"]
        wtTo:
          type: ["number", "null"]
      required:
        - markId
        - job
        - structure
        - markTail
        - contractor
        - activityFrom
        - activityTo
        - qtyFrom
        - qtyTo
        - wtFrom
        - wtTo
    ChangeCounts:
      type: object
      properties:
        addedRows:
          type: integer
        unchangedRows:
          type: integer
        movedActivity:
          type: integer
        qtyChanged:
          type: integer
        newMarks:
          type: integer
        completed:
          type: integer
      required:
        - addedRows
        - unchangedRows
        - movedActivity
        - qtyChanged
        - newMarks
        - completed
    ChangeSet:
      type: object
      properties:
        fromImportId:
          type: ["integer", "null"]
        toImportId:
          type: integer
        fromLabel:
          type: ["string", "null"]
        toLabel:
          type: ["string", "null"]
        counts:
          $ref: "#/components/schemas/ChangeCounts"
        netPendingQtyChange:
          type: number
        netPendingWtChange:
          type: number
        movedActivity:
          type: array
          items:
            $ref: "#/components/schemas/ChangeItem"
        qtyChanged:
          type: array
          items:
            $ref: "#/components/schemas/ChangeItem"
        newMarks:
          type: array
          items:
            $ref: "#/components/schemas/ChangeItem"
        completed:
          type: array
          items:
            $ref: "#/components/schemas/ChangeItem"
        flags:
          type: array
          items:
            type: string
      required:
        - fromImportId
        - toImportId
        - fromLabel
        - toLabel
        - counts
        - netPendingQtyChange
        - netPendingWtChange
        - movedActivity
        - qtyChanged
        - newMarks
        - completed
        - flags
    UploadResult:
      type: object
      properties:
        import:
          $ref: "#/components/schemas/Import"
        changeSet:
          $ref: "#/components/schemas/ChangeSet"
      required:
        - import
        - changeSet
    DeleteAllResult:
      type: object
      properties:
        importsDeleted:
          type: integer
        poolRowsDeleted:
          type: integer
      required:
        - importsDeleted
        - poolRowsDeleted
    StructuralRead:
      type: object
      description: Best-effort structural read of a staged file; never authoritative.
      properties:
        sheetName:
          type: ["string", "null"]
          description: Sheet used (Sheet1 when present, else the first sheet).
        headerRow:
          type: ["integer", "null"]
          description: Detected 0-based header row index, or null when not detected.
        columnsFound:
          type: array
          items:
            type: string
          description: Header labels read from the detected header row.
        missingColumns:
          type: array
          items:
            type: string
          description: Expected columns not present in the header.
        rowsRead:
          type: integer
          description: Data rows below the header (before any filtering).
        rowsWithMark:
          type: integer
          description: Rows that have a non-empty Mark No. (the rows the engine keeps).
        problems:
          type: array
          items:
            type: string
          description: Human-readable structural problems detected without AI.
        wipFormatCheck:
          oneOf:
            - $ref: "#/components/schemas/WipFormatCheck"
            - type: "null"
          description: WIP column classification (critical / known-optional / unknown tiers); null for non-WIP files.
      required:
        - sheetName
        - headerRow
        - columnsFound
        - missingColumns
        - rowsRead
        - rowsWithMark
        - problems
        - wipFormatCheck
    StageResult:
      type: object
      properties:
        stagingId:
          type: string
        sourceFilename:
          type: string
        fileType:
          type: string
          enum: [wip, order-review, unknown]
          description: Detected file type; routes the staged flow (WIP vs Order Review).
        structural:
          oneOf:
            - $ref: "#/components/schemas/StructuralRead"
            - type: "null"
          description: Structural read for WIP files; null for Order Review files.
        orderReview:
          oneOf:
            - $ref: "#/components/schemas/OrderReviewStageInfo"
            - type: "null"
          description: Deterministic read for Order Review files; null for WIP files.
      required:
        - stagingId
        - sourceFilename
        - fileType
        - structural
    OrDataFlag:
      type: object
      description: A single deterministic data quality finding for an Order Review file.
      properties:
        check:
          type: string
