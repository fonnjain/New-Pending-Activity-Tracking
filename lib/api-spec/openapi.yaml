    InventoryBucketRow:
      type: object
      description: >
        One (project, structure) row from the latest Order Review snapshot,
        joined to the newest WIP import for hasWipMarks and mfcBatch
        resolution. Client derives Bucket A/B/C/D membership from these fields.
      properties:
        project:
          type: string
        structure:
          type: string
          nullable: true
        subType:
          type: string
          nullable: true
        weightMt:
          type: number
          nullable: true
          description: Order Qty Weight (Col G). Display weight for Bucket A.
        woOrderQtyMt:
          type: number
          nullable: true
          description: WO Order Qty Weight (Col J). Zero check drives Bucket A.
        releaseMt:
          type: number
          nullable: true
          description: Progress -> Release (Col L). Together with woOrderQtyMt drives Bucket A (both ≈ 0).
        fileBalReleaseMt:
          type: number
          nullable: true
          description: Balance -> Release (Col S). Drives Bucket B (>0) / Bucket C (<=0).
        inspectionMt:
          type: number
          nullable: true
          description: Progress -> Inspection (Col O). Drives Bucket D (>0).
        galvMt:
          type: number
          nullable: true
          description: Progress -> Galvanising (Col N). The "Yard" data column shown on every auto bucket (B/C/D/E).
        balFabMt:
          type: number
          nullable: true
          description: Balance -> Fabrication (Col T). The "Fab" data column (B combines with balGalvMt into Fab+Galva; C/D show separately).
        balGalvMt:
          type: number
          nullable: true
          description: Balance -> Galvanising (Col U). The "Galva" data column (B combines with balFabMt into Fab+Galva; C/D show separately).
        hasWipMarks:
          type: boolean
          description: >
            True when this (project, structure) has at least one mark in the
            latest WIP import with Order Nature = Structure. False means all
            production is finished and the structure has dropped out of the WIP
            file — these rows are excluded from Buckets B/C/D by the client.
        mfcBatch:
          type: string
          description: >
            MFC Batch letter (A/B/C/D) resolved from the structure's WIP marks
            (the batch with the greatest cumulative Balance Weight wins when
            multiple real batches appear on one structure). "Z" when all marks
            have blank/no batch, meaning the structure is live but not yet
            assigned to a batch.
      required:
        - project
        - structure
        - subType
        - weightMt
        - woOrderQtyMt
        - releaseMt
        - fileBalReleaseMt
        - inspectionMt
        - galvMt
        - balFabMt
        - balGalvMt
        - hasWipMarks
        - mfcBatch
    InventoryBucketsResponse:
      type: object
      properties:
        available:
          type: boolean
        asOnDate:
          type: string
          nullable: true
        rows:
          type: array
          items:
            $ref: "#/components/schemas/InventoryBucketRow"
      required:
        - available
        - asOnDate
        - rows
