          type: array
          items:
            $ref: "#/components/schemas/VelocityStageAgg"
      required:
        - importId
        - hasHistory
        - windowReports
        - items
        - projects
        - contractors
        - stages
    ProjectMilestone:
      type: object
      description: Permanent turnaround milestones for one project.
      properties:
        project:
          type: string
        projectStart:
          type: ["string", "null"]
          description: Earliest Assign Date across all marks ever seen (turnaround clock start).
        readyDate:
          type: ["string", "null"]
          description: Date Milestone 1 (all marks at Y or gone) first became true.
        readyTurnaroundDays:
          type: ["integer", "null"]
        dispatchedDate:
          type: ["string", "null"]
          description: Date Milestone 2 (project entirely absent) first became true.
        dispatchedTurnaroundDays:
          type: ["integer", "null"]
        dispatchLagDays:
          type: ["integer", "null"]
          description: dispatchedTurnaroundDays minus readyTurnaroundDays.
        marksTotal:
          type: integer
          description: Distinct mark identities ever seen for the project.
        plannedReadyDays:
          type: ["integer", "null"]
          description: Cumulative target at Y for the project (resolved ideal-days).
        varianceReadyDays:
          type: ["integer", "null"]
          description: readyTurnaroundDays minus plannedReadyDays (+ = slower than planned).
        limitedHistory:
          type: boolean
          description: Captured with no prior in-progress observation.
        reopened:
          type: boolean
          description: A mark returned to an earlier activity after a milestone was captured.
      required:
        - project
        - projectStart
        - readyDate
        - readyTurnaroundDays
        - dispatchedDate
        - dispatchedTurnaroundDays
        - dispatchLagDays
        - marksTotal
        - plannedReadyDays
        - varianceReadyDays
        - limitedHistory
        - reopened
    MilestonesResponse:
      type: object
      description: Permanent per-project turnaround milestones.
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ProjectMilestone"
        generatedAt:
          type: string
      required:
        - items
        - generatedAt
    AccumulatedWipProject:
      type: object
      description: Lifetime accumulated WIP totals for one project.
      properties:
        project:
          type: string
        fabricationMt:
          type: number
          description: Tonnage added each time a mark left TS into G (TLT projects only).
        galvanizingMt:
          type: number
          description: Tonnage added each time a mark left Y (dispatched/completed).
      required:
        - project
        - fabricationMt
        - galvanizingMt
    AccumulatedWipTotals:
      type: object
      description: Overall (all-project) lifetime accumulated WIP totals.
      properties:
        fabricationMt:
          type: number
        galvanizingMt:
          type: number
      required:
        - fabricationMt
        - galvanizingMt
    AccumulatedWipStructure:
      type: object
      description: >
        Lifetime accumulated WIP totals for one project+structure -- the
        structure-wise rollup of the mark-wise ledger, sitting between the
        mark-level events and the project-wise byProject totals.
      properties:
        project:
          type: string
        structure:
          type: string
        fabricationMt:
          type: number
        galvanizingMt:
          type: number
      required:
        - project
        - structure
        - fabricationMt
        - galvanizingMt
    AccumulatedWipResponse:
      type: object
      description: >
        Lifetime accumulated WIP throughput totals, computed mark-wise then
        rolled up structure-wise (byStructure) then project-wise (byProject),
        plus the overall (all-project) sum.
      properties:
        overall:
          $ref: "#/components/schemas/AccumulatedWipTotals"
        byProject:
          type: array
          items:
            $ref: "#/components/schemas/AccumulatedWipProject"
        byStructure:
          type: array
          items:
            $ref: "#/components/schemas/AccumulatedWipStructure"
        generatedAt:
          type: string
      required:
        - overall
        - byProject
        - byStructure
        - generatedAt
    ContractorMovementEntry:
      type: object
      description: >
        One aggregated activity move: how many marks (and how much weight)
        moved from `fromActivity` to `toActivity` on `date`, within
        `project`, credited to `contractor` (the contractor of the FROM
        activity). Null contractor displays as "Unassigned".
      properties:
        date:
          type: string
          description: YYYY-MM-DD.
        project:
          type: string
        contractor:
          type: string
          nullable: true
        fromActivity:
          type: string
        toActivity:
          type: string
        markCount:
          type: integer
        weightKg:
          type: number
      required:
        - date
        - project
        - contractor
        - fromActivity
        - toActivity
        - markCount
        - weightKg
    ContractorMovementResponse:
      type: object
      description: Contractor Performance daily activity-movement ledger.
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/ContractorMovementEntry"
        generatedAt:
          type: string
      required:
        - entries
        - generatedAt
    AdminRecomputeResult:
      type: object
      description: Result summary of a manual admin recompute run.
      properties:
        classificationBackfilled:
          type: integer
          description: Record-pool rows whose classification columns were backfilled.
        holeOperationBackfilled:
          type: integer
          description: Record-pool rows whose hole-operation columns were backfilled.
        milestonesCount:
          type: integer
          description: Per-project milestone rows after recompute.
        accumulatedWipProjects:
          type: integer
          description: Projects covered by the recomputed accumulated-WIP totals.
        contractorMovementEntries:
          type: integer
          description: Contractor movement ledger entries after recompute.
        generatedAt:
          type: string
      required:
        - classificationBackfilled
        - holeOperationBackfilled
        - milestonesCount
        - accumulatedWipProjects
        - contractorMovementEntries
        - generatedAt
    OrderReviewFieldChange:
      type: object
      description: One field's value change for an updated order row.
      properties:
        field:
          type: string
        from:
          type: ["string", "number", "null"]
        to:
          type: ["string", "number", "null"]
      required:
        - field
        - from
        - to
    OrderReviewRowChange:
      type: object
      description: One updated (project, structure) order row with its field changes.
      properties:
        project:
          type: string
        structure:
          type: string
        changes:
          type: array
          items:
            $ref: "#/components/schemas/OrderReviewFieldChange"
      required:
        - project
        - structure
        - changes
    OrderReviewKeyRef:
      type: object
      description: A (project, structure) order-row reference.
      properties:
        project:
          type: string
        structure:
          type: string
      required:
        - project
        - structure
    OrderReviewChangeLog:
      type: object
      description: What one Order Review upload changed vs the current order rows.
      properties:
        inserted:
          type: array
          items:
            $ref: "#/components/schemas/OrderReviewKeyRef"
        updated:
          type: array
          items:
            $ref: "#/components/schemas/OrderReviewRowChange"
        unchanged:
          type: integer
        flagged:
          type: array
          description: Current rows absent from this upload (kept, not deleted).
          items:
            $ref: "#/components/schemas/OrderReviewKeyRef"
      required:
        - inserted
        - updated
        - unchanged
        - flagged
    OrderReviewImport:
      type: object
      description: One Order Review file upload (rows are upserted, not appended).
      properties:
        id:
          type: integer
        label:
          type: ["string", "null"]
        sourceFilename:
          type: string
        asOnDate:
          type: ["string", "null"]
        summary:
          $ref: "#/components/schemas/OrderReviewSummary"
        changeLog:
          oneOf:
            - $ref: "#/components/schemas/OrderReviewChangeLog"
            - type: "null"
        createdAt:
          type: string
      required:
        - id
        - label
        - sourceFilename
        - asOnDate
        - summary
        - changeLog
        - createdAt
    OrderReviewSummary:
      type: object
      description: Parse summary for an Order Review ingest.
      properties:
        rowsRead:
          type: integer
        rowsKept:
          type: integer
        projectsFound:
          type: integer
        totalWeightMt:
          type: number
        totalReleaseMt:
          type: number
        totalFileDespatchMt:
          type: number
        skippedTotals:
          type: integer
        missingStructure:
          type: integer
        matchedToWip:
          type: integer
          description: File structures that match a structure in the newest WIP import.
        unmatchedToWip:
          type: integer
          description: File structures with no matching structure in the newest WIP import.
      required:
        - rowsRead
        - rowsKept
        - projectsFound
        - totalWeightMt
        - totalReleaseMt
        - totalFileDespatchMt
        - skippedTotals
        - missingStructure
        - matchedToWip
        - unmatchedToWip
    OrderStatusRow:
      type: object
      description: One (project, structure) order row joined to computed dispatch.
      properties:
        project:
          type: string
        structure:
          type: string
        subType:
          type: ["string", "null"]
        sets:
          type: ["integer", "null"]
        weightMt:
          type: ["number", "null"]
        woOrderQtyMt:
          type: ["number", "null"]
          description: WO Order Qty MT (col J) from the Order Review file — the ordered base for the balance columns.
        bomType:
          type: ["string", "null"]
        releaseMt:
          type: ["number", "null"]
        fileFabMt:
          type: ["number", "null"]
          description: Progress Fabrication MT from the Order Review file (display fallback for structures absent from WIP).
        fileGalvMt:
          type: ["number", "null"]
          description: Progress Galvanising MT from the Order Review file (display fallback for structures absent from WIP).
        fileDespatchMt:
          type: ["number", "null"]
          description: Despatch MT as stated in the Order Review file.
        fileBalReleaseMt:
          type: ["number", "null"]
          description: Balance Release MT as stated in the Order Review file (col S).
        fileBalDespatchMt:
          type: ["number", "null"]
          description: Balance Despatch MT as stated in the Order Review file (col W).
        releaseBalanceMt:
          type: ["number", "null"]
          description: Computed Release balance = WO Order Qty (col J) - Release (col L). Null when WO Order Qty is blank.
        dispatchBalanceMt:
          type: ["number", "null"]
          description: Computed Despatch balance = WO Order Qty (col J) - File Despatch (col Q). Null when WO Order Qty is blank.
        seedMt:
          type: number
          description: One-time dispatch baseline captured from the first Order Review file.
        accruedMt:
          type: number
          description: Tonnes that left the Yard across WIP imports after the seed.
        computedDispatchMt:
          type: number
          description: WIP-derived dispatch only (equals accruedMt). The Order Review file/seed never contributes.
        notInLatest:
          type: boolean
          description: Current order row absent from the latest Order Review file (kept, not deleted).
      required:
        - project
        - structure
        - subType
        - sets
        - weightMt
        - woOrderQtyMt
        - bomType
        - releaseMt
        - fileFabMt
        - fileGalvMt
        - fileDespatchMt
        - fileBalReleaseMt
        - fileBalDespatchMt
        - releaseBalanceMt
        - dispatchBalanceMt
        - seedMt
        - accruedMt
        - computedDispatchMt
        - notInLatest
    DispatchReconciliationRow:
      type: object
      description: File-vs-computed dispatch comparison for one (project, structure).
      properties:
        project:
          type: string
        structure:
          type: string
        fileDespatchMt:
          type: ["number", "null"]
        computedDispatchMt:
          type: number
        diffMt:
          type: ["number", "null"]
        diffPct:
          type: ["number", "null"]
        status:
          type: string
          enum: [match, mismatch, no_file, no_computed]
      required:
        - project
        - structure
        - fileDespatchMt
        - computedDispatchMt
        - diffMt
        - diffPct
        - status
    DispatchReconciliation:
      type: object
      properties:
        tolerancePct:
          type: number
        matched:
          type: integer
        mismatched:
          type: integer
        rows:
          type: array
          items:
            $ref: "#/components/schemas/DispatchReconciliationRow"
      required:
        - tolerancePct
        - matched
        - mismatched
        - rows
    BalanceReconciliationRow:
      type: object
      description: File-vs-computed comparison of the two order balances for one (project, structure).
      properties:
        project:
          type: string
        structure:
          type: string
        woOrderQtyMt:
          type: ["number", "null"]
        computedReleaseBalanceMt:
          type: ["number", "null"]
        fileReleaseBalanceMt:
          type: ["number", "null"]
        releaseDiffMt:
          type: ["number", "null"]
        releaseDiffPct:
          type: ["number", "null"]
        releaseStatus:
          type: string
          enum: [match, mismatch, no_file, no_computed]
        computedDispatchBalanceMt:
          type: ["number", "null"]
        fileDispatchBalanceMt:
          type: ["number", "null"]
        dispatchDiffMt:
          type: ["number", "null"]
        dispatchDiffPct:
          type: ["number", "null"]
        dispatchStatus:
          type: string
          enum: [match, mismatch, no_file, no_computed]
      required:
        - project
        - structure
        - woOrderQtyMt
        - computedReleaseBalanceMt
        - fileReleaseBalanceMt
        - releaseDiffMt
        - releaseDiffPct
        - releaseStatus
        - computedDispatchBalanceMt
        - fileDispatchBalanceMt
        - dispatchDiffMt
        - dispatchDiffPct
        - dispatchStatus
    BalanceReconciliation:
      type: object
      properties:
        tolerancePct:
          type: number
        absFloorMt:
          type: number
        releaseMatched:
          type: integer
        releaseMismatched:
          type: integer
        dispatchMatched:
          type: integer
        dispatchMismatched:
          type: integer
        rows:
          type: array
          items:
            $ref: "#/components/schemas/BalanceReconciliationRow"
      required:
        - tolerancePct
        - absFloorMt
        - releaseMatched
        - releaseMismatched
        - dispatchMatched
        - dispatchMismatched
        - rows
    OrderStatusResponse:
      type: object
      description: Order Review overlay joined to computed dispatch.
      properties:
        available:
          type: boolean
        asOnDate:
          type: ["string", "null"]
        fileImport:
          oneOf:
            - $ref: "#/components/schemas/OrderReviewImport"
            - type: "null"
        rows:
          type: array
          items:
            $ref: "#/components/schemas/OrderStatusRow"
        reconciliation:
          $ref: "#/components/schemas/DispatchReconciliation"
        balanceReconciliation:
          $ref: "#/components/schemas/BalanceReconciliation"
        imports:
          type: array
          items:
            $ref: "#/components/schemas/OrderReviewImport"
      required:
        - available
        - asOnDate
        - fileImport
        - rows
        - reconciliation
        - balanceReconciliation
        - imports
    ReviewRequest:
      type: object
      properties:
        importId:
          type: integer
          description: The import to review.
        compareTo:
          type: ["integer", "null"]
          description: Optional base import id to compare against instead of the previous import.
        deep:
          type: ["boolean", "null"]
          description: Request a deeper model pass that adds a prioritized remediation plan.
      required:
        - importId
    ReviewFinding:
      type: object
      properties:
        severity:
          type: string
          enum: [info, warn, error]
        check:
          type: string
          description: Name of the consistency check.
        markId:
          type: ["string", "null"]
        message:
          type: string
        expected:
          type: ["string", "null"]
        actual:
          type: ["string", "null"]
      required:
        - severity
        - check
        - markId
        - message
        - expected
        - actual
    ReviewResult:
      type: object
      properties:
        available:
          type: boolean
          description: False when ANTHROPIC_API_KEY is unset.
        verdict:
          type: ["string", "null"]
          enum: [pass, warn, fail, null]
        summary:
          type: ["string", "null"]
        stats:
          type: ["object", "null"]
          additionalProperties: true
          description: Free-form key/value stats produced by the review.
        findings:
          type: array
          items:
            $ref: "#/components/schemas/ReviewFinding"
        plan:
          type: ["array", "null"]
          items:
            type: string
          description: Prioritized remediation steps, present only after a deep review.
        deep:
          type: boolean
          description: True when the result came from the deeper model pass.
      required:
        - available
        - verdict
        - summary
        - stats
        - findings
        - plan
        - deep
    ReportFilters:
      type: object
      description: Optional slice to analyze. When all fields are empty the whole import is analyzed.
      properties:
        job:
          type: ["string", "null"]
        structure:
          type: ["string", "null"]
        mark:
          type: ["string", "null"]
          description: Matches a record's markId or markTail.
        contractor:
          type: ["string", "null"]
        activity:
          type: ["string", "null"]
        search:
          type: ["string", "null"]
          description: Case-insensitive substring over markId, markTail, section, contractor.
        dateStart:
          type: ["string", "null"]
          description: Inclusive assign-date lower bound (YYYY-MM-DD).
        dateEnd:
          type: ["string", "null"]
          description: Exclusive assign-date upper bound (YYYY-MM-DD).
    ReportRequest:
      type: object
      properties:
        importId:
          type: integer
          description: The import to analyze.
        compareTo:
          type: ["integer", "null"]
          description: Optional base import id for throughput deltas instead of the previous import.
        regenerate:
          type: ["boolean", "null"]
          description: Ignore any cached report and generate a fresh one.
        filters:
          $ref: "#/components/schemas/ReportFilters"
      required:
        - importId
    ReportRisk:
