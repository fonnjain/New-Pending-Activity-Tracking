          type: ["string", "null"]
        sets:
          type: ["integer", "null"]
        weightMt:
          type: ["number", "null"]
        woOrderQtyMt:
          type: ["number", "null"]
          description: WO Order Qty MT (col J) from the Order Review file — the ordered base for the balance columns.
        bomType:
          type: ["string", "null"]
        releaseMt:
          type: ["number", "null"]
        fileFabMt:
          type: ["number", "null"]
          description: Progress Fabrication MT from the Order Review file (display fallback for structures absent from WIP).
        fileGalvMt:
          type: ["number", "null"]
          description: Progress Galvanising MT from the Order Review file (display fallback for structures absent from WIP).
        fileDespatchMt:
          type: ["number", "null"]
          description: Despatch MT as stated in the Order Review file.
        fileBalReleaseMt:
          type: ["number", "null"]
          description: Balance Release MT as stated in the Order Review file (col S).
        fileBalDespatchMt:
          type: ["number", "null"]
          description: Balance Despatch MT as stated in the Order Review file (col W).
        releaseBalanceMt:
          type: ["number", "null"]
          description: Computed Release balance = WO Order Qty (col J) - Release (col L). Null when WO Order Qty is blank.
        dispatchBalanceMt:
          type: ["number", "null"]
          description: Computed Despatch balance = WO Order Qty (col J) - File Despatch (col Q). Null when WO Order Qty is blank.
        seedMt:
          type: number
          description: One-time dispatch baseline captured from the first Order Review file.
        accruedMt:
          type: number
          description: Tonnes that left the Yard across WIP imports after the seed.
        computedDispatchMt:
          type: number
          description: WIP-derived dispatch only (equals accruedMt). The Order Review file/seed never contributes.
        balFabMt:
          type: ["number", "null"]
          description: Balance Fabrication MT from the Order Review file (col T).
        balGalvMt:
          type: ["number", "null"]
          description: Balance Galvanising MT from the Order Review file (col U).
        inspectionMt:
          type: ["number", "null"]
          description: Progress Inspection MT from the Order Review file (col O). Used by the OR consistency panel.
        balWoMt:
          type: ["number", "null"]
          description: Balance Work Order MT from the Order Review file (col R) — remaining work-order qty. Null for rows ingested before this column was parsed.
        notInLatest:
          type: boolean
          description: Current order row absent from the latest Order Review file (kept, not deleted).
